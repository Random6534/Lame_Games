<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollowmere</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+SC:wght@500;700&family=Jacquard+24&display=swap">
<style>
/* Layout: one walnut-framed game window — HUD strip, canvas stage, then controls or battle menu; dialogs are parchment */
:root{
  --bg:#130e0a; --wood:#2a1d14; --wood2:#3a281a; --line:#5c4128; --trim:#8a6a3e;
  --ink:#efe3c4; --dim:#b29d78; --parch:#eadbb4; --parch2:#d9c595; --pink:#3a2616; --pdim:#6e5537;
  --ox:#8b2e24; --gold:#d4a23c; --hp:#b8402f; --mp:#3f6fc0; --xp:#8aa53a; --night:#a9a2e0;
  --display:'Jacquard 24','UnifrakturMaguntia',Georgia,serif; --sc:'Alegreya SC',Georgia,serif; --body:'Alegreya',Georgia,serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.4;padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at top,#211710,var(--bg) 70%) var(--bg)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{font-family:var(--sc);font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--ink);
  background:linear-gradient(#5d4027,#45301d);border:2px solid #1e140d;box-shadow:inset 0 1px 0 #7d5a36,0 2px 0 #1e140d;
  border-radius:3px;padding:8px 13px;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:8px;position:relative}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 #7d5a36}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:13px;padding:5px 10px}
.btn.seal{background:linear-gradient(#a3372b,#7a271e);box-shadow:inset 0 1px 0 #c25446,0 2px 0 #3d120d}
kbd{font-family:var(--sc);font-size:11px;color:var(--dim);border:1px solid #6b4c30;padding:0 4px;border-radius:2px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:linear-gradient(#33231a,#261a12);
  border:3px solid var(--line);box-shadow:inset 0 0 0 1px var(--trim),0 3px 0 #0b0806;padding:10px 12px;border-radius:4px}
.id{display:flex;align-items:center;gap:12px}
.lvl{display:grid;place-items:center;width:50px;height:50px;border-radius:47% 53% 50% 50%/52% 46% 54% 48%;
  background:radial-gradient(circle at 38% 34%,#b8453a,#7a251c 70%);box-shadow:0 0 0 3px #5e1b14,inset 0 -3px 0 #5e1b14;line-height:1;text-align:center}
.lvl .lbl{display:block;font-size:10px;color:#f3d9a8;letter-spacing:.12em}
.lvl b{font-family:var(--sc);font-size:20px;color:#fbe7b8}
.where{display:flex;flex-direction:column;gap:2px}
#hPlace{font-family:var(--display);font-size:26px;line-height:1;color:var(--gold)}
.time{font-family:var(--sc);font-size:12px;letter-spacing:.1em;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase}
.time::before{content:"";width:10px;height:10px;border-radius:50%}
.time.day{color:var(--gold)} .time.day::before{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.time.night{color:var(--night)} .time.night::before{box-shadow:inset -3px -1px 0 0 var(--night)}
.bars{flex:1 1 220px;min-width:0;display:grid;gap:5px}
.row{display:grid;grid-template-columns:24px 1fr 72px;gap:8px;align-items:center}
.lbl{font-family:var(--sc);font-size:12px;color:var(--dim);letter-spacing:.06em}
.bar{height:11px;background:#120c08;border:1px solid #6b4c30;overflow:hidden;border-radius:2px}
.bar i{display:block;height:100%;transition:width .25s;box-shadow:inset 0 2px 0 rgba(255,255,255,.18)}
.bar.hp i{background:var(--hp)} .bar.mp i{background:var(--mp)} .bar.xp i{background:var(--xp)}
.num{font-family:var(--sc);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gold{font-family:var(--sc);font-weight:700;font-size:16px;color:var(--gold);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #9a6f22}
.hbtns{display:flex;gap:6px}
.badge{position:absolute;top:-8px;right:-8px;background:var(--xp);color:#1b230a;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}

/* Stage */
.stage{position:relative;border:3px solid var(--line);box-shadow:inset 0 0 0 1px var(--trim),0 0 0 1px #0b0806;background:#000;line-height:0;border-radius:3px;overflow:hidden}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#fade{position:absolute;inset:0;background:#05040a;opacity:0;pointer-events:none;transition:opacity .4s}

/* Battle */
.battle{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px}
.log{background:linear-gradient(var(--parch),var(--parch2));color:var(--pink);border:3px solid var(--line);border-radius:3px;padding:10px 14px;min-height:124px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:16px}
.log p{margin:0;color:var(--pdim)} .log p:last-child{color:var(--pink);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.actions .btn{min-height:48px}

/* Touch */
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 6px}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.dpad button,.abtn{font-family:var(--sc);color:var(--ink);background:linear-gradient(#5d4027,#45301d);border:2px solid #1e140d;box-shadow:inset 0 1px 0 #7d5a36;border-radius:4px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad .u{grid-area:1/2} .dpad .l{grid-area:2/1} .dpad .r{grid-area:2/3} .dpad .d{grid-area:3/2}
.dpad button:active,.abtn:active{filter:brightness(1.25)}
.abtn{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#b8453a,#7a251c 70%);color:#fbe7b8;font-size:24px}
.keys{margin:0;font-family:var(--sc);font-size:13px;color:var(--dim);letter-spacing:.03em;display:flex;flex-wrap:wrap;gap:6px 18px}
@media (hover:hover) and (pointer:fine){ .controls{display:none} }
@media not ((hover:hover) and (pointer:fine)){ .keys{display:none} }
@media (max-width:520px){ .battle{grid-template-columns:1fr} .log{min-height:96px} #hPlace{font-size:22px} }

/* Parchment dialogs */
.modal{position:fixed;inset:0;background:rgba(8,5,3,.7);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{width:min(500px,100%);max-height:86vh;overflow:auto;color:var(--pink);
  background:radial-gradient(ellipse at center,var(--parch) 55%,var(--parch2));border:3px solid var(--line);
  box-shadow:0 0 0 5px #20160f,0 0 0 7px var(--trim),0 12px 40px rgba(0,0,0,.6);border-radius:3px;padding:20px;display:flex;flex-direction:column;gap:11px}
.mbox h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--ox)}
.mbox h3{font-family:var(--sc);font-size:14px;color:var(--pdim);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #b89c68;padding-bottom:3px;margin-top:4px}
.mbox p{margin:0;max-width:62ch}
.say{font-style:italic}
.sub{color:var(--pdim);font-size:16px}
.g{color:#7a5314}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:4px 0;border-bottom:1px dotted #b89c68}
.item b{font-family:var(--sc);font-size:16px}
.item small{display:block;color:var(--pdim);font-size:15px}
.price{font-family:var(--sc);font-weight:700;font-size:15px;color:#7a5314;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:minmax(0,1fr) 34px auto;gap:10px;align-items:center;padding:3px 0;border-bottom:1px dotted #b89c68}
.stat b{font-family:var(--sc);font-size:16px}
.stat .v{font-family:var(--sc);font-weight:700;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 16px;font-size:16px}
.derived span{color:var(--pdim)} .derived b{font-family:var(--sc);float:right}
.pts{background:#f3e7c4;border:1px dashed var(--ox);color:var(--ox);padding:7px 10px;font-family:var(--sc);font-weight:700;font-size:15px;border-radius:3px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--parch);color:var(--pink);border:3px solid var(--line);box-shadow:0 0 0 2px var(--trim);padding:9px 18px;font-family:var(--sc);font-weight:700;font-size:15px;border-radius:3px;max-width:min(90vw,480px);text-align:center}
@media (prefers-reduced-motion:reduce){ #fade,.bar i{transition:none} }
</style>
</head>
<body>


<div class="wrap">
  <header class="hud">
    <div class="id">
      <div class="lvl"><div><span class="lbl">LV</span><b id="hLv">1</b></div></div>
      <div class="where"><span id="hPlace">Hollowmere</span><span id="hTime" class="time day">Day</span></div>
    </div>
    <div class="bars">
      <div class="row"><span class="lbl">HP</span><div class="bar hp"><i id="hHPb"></i></div><span id="hHP" class="num"></span></div>
      <div class="row"><span class="lbl">MP</span><div class="bar mp"><i id="hMPb"></i></div><span id="hMP" class="num"></span></div>
      <div class="row"><span class="lbl">XP</span><div class="bar xp"><i id="hXPb"></i></div><span id="hXP" class="num"></span></div>
    </div>
    <div class="side">
      <div class="gold"><i class="coin"></i><span id="hGold">0</span> g</div>
      <div class="hbtns">
        <button class="btn sm" id="bStats">Talents<span id="ptsBadge" class="badge" hidden>0</span></button>
        <button class="btn sm" id="bBag">Satchel</button>
      </div>
    </div>
  </header>

  <div class="stage">
    <canvas id="cv" width="640" height="480" aria-label="Game world"></canvas>
    <div id="fade"></div>
  </div>

  <section class="battle" id="battleUI" hidden>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="actions" id="actions"></div>
  </section>

  <section class="controls" id="controls">
    <div class="dpad">
      <button class="u" data-d="up" aria-label="Up">▲</button>
      <button class="l" data-d="left" aria-label="Left">◀</button>
      <button class="r" data-d="right" aria-label="Right">▶</button>
      <button class="d" data-d="down" aria-label="Down">▼</button>
    </div>
    <button class="abtn" id="aBtn" aria-label="Talk or search">A</button>
  </section>
  <p class="keys"><span>Move: WASD / Arrows</span><span>Talk · Search: Space</span><span>Talents: C</span><span>Satchel: B</span><span>Battle: 1–4</span></p>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'), cx=cv.getContext('2d');
const TS=32, W=640, H=480;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(x,y,k=0){let h=(x*374761393+y*668265263+k*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;}

/* =================== WORLD =================== */
const BUILDINGS=[
  {x:4,y:4,w:8,h:7,roof:'thatch',door:7,kind:'inn',sign:'INN',shutter:'#3f6b35',chimney:1,to:{map:'inn',x:6,y:12}},
  {x:14,y:6,w:5,h:5,roof:'thatch',door:16,kind:'house',shutter:'#2f5f8a',chimney:1,msg:'Locked. Someone inside is snoring loudly.'},
  {x:26,y:4,w:8,h:7,roof:'tile',door:29,kind:'shop',sign:'SHOP',shutter:'#8b2e24',chimney:1,to:{map:'shop',x:7,y:12}},
  {x:36,y:6,w:5,h:5,roof:'tile',door:38,kind:'house',shutter:'#3f6b35',msg:'Locked. A cat stares at you from the window.'},
  {x:5,y:20,w:7,h:7,roof:'slate',door:8,kind:'chapel',to:{map:'chapel',x:7,y:12}},
  {x:14,y:22,w:5,h:5,roof:'thatch',door:16,kind:'house',shutter:'#8b2e24',chimney:1,msg:'Locked. You hear a baby crying.'},
  {x:26,y:22,w:5,h:5,roof:'thatch',door:28,kind:'house',shutter:'#2f5f8a',msg:'Locked. A note reads: "Gone to the fields. Back by dusk."'},
  {x:34,y:21,w:6,h:6,roof:'slate',door:36,kind:'house',shutter:'#4a3220',chimney:1,msg:'The smithy is shut. "Closed for the harvest festival."'}];

function makeTown(){
  const w=44,h=32,G=[],O=[];
  for(let y=0;y<h;y++){G.push(Array(w).fill('.'));O.push(Array(w).fill(' '))}
  const R=(A,c,x,y,ww,hh)=>{for(let j=y;j<y+hh;j++)for(let i=x;i<x+ww;i++)if(j>=0&&j<h&&i>=0&&i<w)A[j][i]=c};
  R(G,'=',2,11,40,2);R(G,'=',2,27,40,2);
  R(G,'#',1,15,w-1,2);R(G,'#',21,1,2,h-2);R(G,'#',17,12,10,8);
  R(G,'W',0,0,w,1);R(G,'W',0,h-1,w,1);R(G,'W',0,0,1,h);R(G,'W',w-1,0,1,h);
  R(G,'E',w-1,15,1,2);
  [[0,0],[w-1,0],[0,h-1],[w-1,h-1],[w-1,14],[w-1,17],[0,15],[11,0],[32,0],[11,h-1],[32,h-1]].forEach(([x,y])=>O[y][x]='Z');
  R(G,'w',30,18,4,2);
  R(O,'q',10,18,5,2);R(O,'F',9,17,7,1);
  for(const b of BUILDINGS){R(O,'H',b.x,b.y,b.w,b.h);O[b.y+b.h-1][b.door]='U'}
  O[13][18]='O';O[13][24]='k';O[13][25]='k';O[18][18]='k';O[18][19]='k';O[18][26]='b';O[13][26]='x';O[18][17]='x';
  [[20,12],[23,12],[20,19],[23,19],[8,14],[34,14],[8,17],[34,17],[41,17],[3,14]].forEach(([x,y])=>O[y][x]='L');
  O[14][39]='P';
  O[10][12]='b';O[9][12]='x';O[10][34]='b';O[9][34]='x';O[10][25]='b';O[25][40]='h';O[26][40]='h';O[26][33]='x';O[26][41]='b';
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    if(G[y][x]!=='.'||O[y][x]!==' ')continue;let ok=true;
    for(let j=-1;j<=1&&ok;j++)for(let i=-1;i<=1;i++){if(G[y+j][x+i]!=='.'&&G[y+j][x+i]!=='f'||O[y+j][x+i]!==' '&&O[y+j][x+i]!=='T'){ok=false;break}}
    if(ok&&hash(x,y,11)<.24)O[y][x]='T'; else if(hash(x,y,12)<.08)G[y][x]='f';
  }
  return {ground:G.map(r=>r.join('')),obj:O.map(r=>r.join(''))};
}
function makeField(){
  const w=30,h=20,G=[],O=[];
  for(let y=0;y<h;y++){let g='',o='';for(let x=0;x<w;x++){let c='v',ob=' ';
    if(x===0||y===0||x===w-1||y===h-1)ob='T';
    else{const n=Math.sin(x*.42+1.3)+Math.sin(y*.55+.4)+Math.sin((x+y)*.27+2.1)+Math.sin((x-y)*.31);
      if(n>1.5)c='.'; if(hash(x,y,77)<.04)ob='T'; else if(hash(x,y,78)<.025)ob='R';
      if(((x-21)**2)/10+((y-6)**2)/4<1){c='w';ob=' '}}
    if(y===10&&x<=6){c='=';ob=' '} if(x===0&&y===10){c='X';ob=' '}
    if(x<=3&&Math.abs(y-10)<=1&&c!=='X'&&c!=='='){c='.';if(x>0)ob=' '}
    g+=c;o+=ob}G.push(g);O.push(o)}
  return {ground:G,obj:O};
}
const TOWN=makeTown(), FIELD=makeField();
const MAPS={
  town:{name:'Hollowmere',outdoor:true,tiles:TOWN.ground,obj:TOWN.obj,npcs:[
    {x:42,y:14,kind:'guard',name:'Gate Guard',lines:['"The fields are tame by day. Slimes, bees, the odd boar."','"After dark the dead walk out there. Fire works best on them, so carry Mana Tonics."','"I saw something big and grey at the treeline. Stay away until you\'re stronger."']},
    {x:19,y:13,kind:'maud',name:'Old Maud',lines:['"Rest at the Sleeping Stag, dearie. Bram keeps the beds warm."','"Marrow\'s shop sells blades, but his storerooms hold more than he lets on. Go and have a look."','"Pray at the chapel if you\'re hurt. Sister Elin never turns anyone away."']}]},
  field:{name:'Open Fields',outdoor:true,tiles:FIELD.ground,obj:FIELD.obj,npcs:[]},
  inn:{name:'The Sleeping Stag',outdoor:false,floor:'wood',stone:'#6d655a',mortar:'#4f493f',keeper:'innkeeper',exit:{x:7,y:11},tiles:[
"#353#4#77#5#4##45454##",
"#b.K.b.rr....#.BnBnB.#",
"#CCCCC.rr....#.Q.Q.Q.#",
"#............#.......#",
"#......cTc...#..rrr..#",
"#............#..rrr..#",
"#..cTc...cTc.#.......#",
"#............d.......#",
"#............d.......#",
"#b.....cTc...#x.....x#",
"#b...........#.......#",
"#....rrr.....#b.....b#",
"#....rrr.....#.......#",
"######D###############"]},
  shop:{name:"Marrow's Outfitters",outdoor:false,floor:'wood',stone:'#645c52',mortar:'#48423a',keeper:'merchant',exit:{x:29,y:11},tiles:[
"#12133151332124##4#5#4##",
"#W.Cb..K..xC..M#bb,bb,b#",
"#..C.......C...#,,,,,,x#",
"#.WCCCCCCCCC...#b,,s,,b#",
"#...rrrrrrr....#b,,,,,x#",
"#M...........S.d,,,,,,,#",
"#..............d,,,,,,s#",
"#M...........S.###,#5###",
"#..............#bb,x,bb#",
"#.W..........W.#b,,,,,b#",
"#..............#x,,s,,x#",
"#.....rrr......#bb,,,bb#",
"#.....rrr......#bsx,xbb#",
"#######D################"]},
  chapel:{name:'Chapel of the Dawn',outdoor:false,floor:'stone',stone:'#958e83',mortar:'#746e64',keeper:'priest',exit:{x:8,y:27},tiles:[
"#8#8##686##8#8#",
"#n....AAA....n#",
"#......K......#",
"#......r......#",
"#.PPPP.r.PPPP.#",
"#......r......#",
"#.PPPP.r.PPPP.#",
"#......r......#",
"#.PPPP.r.PPPP.#",
"#......r......#",
"#n.PPP.r.PPP.n#",
"#......r......#",
"#n.....r.....n#",
"#######D#######"]}};
for(const k in MAPS){const M=MAPS[k];M.h=M.tiles.length;M.w=M.tiles[0].length;M.npcs=M.npcs||[];
  if(!M.outdoor)M.tiles.forEach((r,y)=>{for(let x=0;x<r.length;x++)if(r[x]==='K')M.npcs.push({x,y,kind:M.keeper})})}
const OUT_SOLID=new Set('TZOPLkbxFhHUqR');
const IN_SOLID=new Set('#12345678 CKBQnbxsTcMWSPA');
const tileAt=(m,x,y)=>{const M=MAPS[m],r=M.tiles[y];return r&&x>=0&&x<r.length?r[x]:(M.outdoor?'W':' ')};
const objAt=(m,x,y)=>{const M=MAPS[m];if(!M.obj)return ' ';const r=M.obj[y];return r&&x>=0&&x<r.length?r[x]:' '};
const npcAt=(x,y)=>MAPS[S.map].npcs.find(n=>n.x===x&&n.y===y);
function isSolid(x,y){const M=MAPS[S.map];if(x<0||y<0||x>=M.w||y>=M.h)return true;if(npcAt(x,y))return true;
  if(M.outdoor){const o=objAt(S.map,x,y);if(o!==' '&&OUT_SOLID.has(o))return true;const g=tileAt(S.map,x,y);return g==='w'||g==='W'}
  return IN_SOLID.has(tileAt(S.map,x,y))}

function search(x,y,t){
  const k=S.map+':'+x+','+y;if(S.searched.includes(k)){say(SNAME[t],'You have already searched this. Nothing else here.');return}

  if(r<.3){S.bag.potion++;msg='You find a Healing Draught tucked inside!'}
  else if(r<.55){const g=ri(4,14);S.gold+=g;msg=`You find ${g} g wrapped in an old rag.`}

/* =================== EXPLORE LOGIC =================== */
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const canMove=()=>scene==='explore'&&!modalOpen()&&!fading;
function tryMove(d){
  P.dir=d;const [dx,dy]=DIRS[d],nx=P.x+dx,ny=P.y+dy;
  if(isSolid(nx,ny)){interactAt(nx,ny,true);return}
  P.fx=P.x;P.fy=P.y;P.x=nx;P.y=ny;P.t=0;P.moving=true;P.step++;
}
function enterDoor(x,y){
  const b=BUILDINGS.find(b=>b.door===x&&b.y+b.h-1===y);if(!b)return;
  if(!b.to){say('Locked Door',b.msg);return}
  fade(()=>{S.map=b.to.map;placePlayer(b.to.x,b.to.y,'up');save();hud()});
}
function interactAt(x,y,bump){
  const M=MAPS[S.map],n=npcAt(x,y);if(n){talk(n);return}
  if(M.outdoor){const o=objAt(S.map,x,y);
    if(o==='U'){enterDoor(x,y);return} if(o==='P'){openSign();return}
    if(bump)return;
    if(o==='O'){const h=Math.min(maxHP()-S.hp,8);S.hp+=h;hud();save();say('Town Well',h?`You draw a bucket of cold water and drink. +${h} HP.`:'You drink cold, clear water. Refreshing.')}
    else if(o==='k')say('Market Stall',hash(x,y,3)<.5?'Red apples, rye loaves and a wheel of cheese. The stallkeeper is off at lunch.':'Bolts of dyed wool and a basket of eggs. A sign says "Back soon."');
    else if('bxh'.includes(o)&&o!==' ')search(x,y,o);
    else if(o==='q')say('Turnip Patch','Neat rows of turnips. Best leave them be.');
    else if(o==='L')say('Lamp Post','An iron lantern. The lamplighter fills it with oil at dusk.');
    return}
  const t=tileAt(S.map,x,y);
  if(t==='C'){M.keeper==='innkeeper'?openInnkeeper():openShop();return}
  if(t==='B'||t==='Q'){openBed(x);return}
  if(t==='A'){openPriest();return}
  if(bump)return;
  if('bxs'.includes(t))search(x,y,t);
  else if('123MWS'.includes(t))say('Merchandise','Polished blades, shields and bottled remedies. Talk to Marrow at the counter to buy.');
  else if(t==='7')say('Hearth','The fire crackles. You warm your hands for a moment.');
  else if(t==='P')say('Pew','You sit a moment in the quiet. The candles flicker.');
  else if(t==='8')say('Stained Glass','Saint Aldric raises a lantern against the dark.');
  else if(t==='4')say('Window',S.time==='day'?'Sunlight on the thatched rooftops.':'Torches flicker along the town wall.');
  else if(t==='T')say('Table','A half-finished mug of ale. Not yours.');
  else if(t==='n')say('Candle','A beeswax candle burns low.');
}
function interact(){if(!canMove())return;const [dx,dy]=DIRS[P.dir];interactAt(P.x+dx,P.y+dy,false)}
function arrive(){
  const M=MAPS[S.map],g=tileAt(S.map,P.x,P.y);
  if(S.map==='town'&&g==='E'){fade(()=>{S.map='field';placePlayer(1,10,'right');save();hud()});return}
  if(S.map==='field'&&g==='X'){fade(()=>{S.map='town';placePlayer(42,15,'left');save();hud()});return}
  if(!M.outdoor&&g==='D'){fade(()=>{const e=M.exit;S.map='town';placePlayer(e.x,e.y,'down');save();hud()});return}
  save();
  if(S.map==='field'&&g==='v'){P.enc++;if(P.enc>=3&&Math.random()<.14){P.enc=0;startBattle()}}
}

/* =================== DRAW HELPERS =================== */
function circ(x,y,r){cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
function ell(x,y,a,b,r=0){cx.beginPath();cx.ellipse(x,y,a,b,r,0,7);cx.fill()}
function tri(a,b,c,d,e,f){cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.lineTo(e,f);cx.closePath();cx.fill()}
function seg(pts,w,col){cx.strokeStyle=col;cx.lineWidth=w;cx.beginPath();cx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)cx.lineTo(pts[i],pts[i+1]);cx.stroke()}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.quadraticCurveTo(x+w,y,x+w,y+r);cx.lineTo(x+w,y+h-r);cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);cx.lineTo(x+r,y+h);cx.quadraticCurveTo(x,y+h,x,y+h-r);cx.lineTo(x,y+r);cx.quadraticCurveTo(x,y,x+r,y);cx.fill()}
function flame(x,y,s=1){const f=Math.sin(T*18+x)*1.2+Math.sin(T*11+y);cx.fillStyle='#ff8a2a';ell(x,y-5*s,4*s,8*s+f*.6);cx.fillStyle='#ffe27a';ell(x,y-3*s,2*s,4.5*s+f*.3)}

/* ---- outdoor ground ---- */
function grass(X,Y,x,y){cx.fillStyle='#58893a';cx.fillRect(X,Y,TS,TS);
  for(let i=0;i<3;i++){const a=hash(x,y,i)*26+2,b=hash(x,y,i+7)*24+4;cx.fillStyle=i?'#4a7a2f':'#69a046';cx.fillRect(X+a,Y+b,2,4);cx.fillRect(X+a+2,Y+b-2,2,4)}}
function cobble(X,Y,x,y){cx.fillStyle='#5f5a52';cx.fillRect(X,Y,TS,TS);

/* =================== BATTLE =================== */
function startBattle(){
  const pool=MON.filter(m=>m.time===S.time&&(m.min||1)<=S.lv);let r=Math.random()*pool.reduce((a,m)=>a+m.w,0),base=pool[0];
  for(const m of pool){if((r-=m.w)<0){base=m;break}}
  const lv=Math.max(1,S.lv+ri(-1,1)),k=lv-1;
  const m={...base,lv,maxhp:Math.round(base.hp*(1+.22*k)),atk:Math.round(base.atk*(1+.14*k)),def:Math.round(base.def*(1+.12*k)),xp:Math.round(base.xp*(1+.25*k)),g:Math.round(base.g*(1+.2*k))};
  m.hp=m.maxhp;
  B={m,busy:false,menu:'main',fx:[],shake:0,flash:0,pflash:0,lunge:0,alpha:1,slash:0,fire:0,intro:1,over:false,lines:[]};
  scene='battle';held.length=0;$('#battleUI').hidden=false;$('#controls').style.display='none';
  log(`A level ${lv} ${m.n} leaps from the grass!`);
  if(Math.random()<clamp(.18+(m.agi-S.st.agi)*.04,.05,.5)){B.busy=true;log(`The ${m.n} strikes first!`);setTimeout(enemyTurn,900)}
  renderActions();
}
function log(s){B.lines.push(s);if(B.lines.length>5)B.lines.shift();$('#log').innerHTML=B.lines.map(l=>`<p>${l}</p>`).join('')}
function fx(s,x,y,col,big){B.fx.push({s,x,y,col,big,t:0})}
function renderActions(){
  const box=$('#actions');let items;
  if(B.over)items=[[B.lost?'Wake at the inn':(B.fled?'Return':'Continue'),endBattle]];
  else if(B.menu==='main')items=[['Attack',actAttack],['Skills',()=>{B.menu='skills';renderActions()}],['Items',()=>{B.menu='items';renderActions()}],['Flee',actRun]];
  else if(B.menu==='skills')items=[['Power Strike · 4 MP',()=>skill('power'),S.mp<4],['Fire · 5 MP',()=>skill('fire'),S.mp<5],['Heal · 6 MP',()=>skill('heal'),S.mp<6||S.hp>=maxHP()],['Back',()=>{B.menu='main';renderActions()}]];
  else items=[[`Draught ×${S.bag.potion}`,()=>item('potion'),!S.bag.potion],[`Tonic ×${S.bag.ether}`,()=>item('ether'),!S.bag.ether],[`Smoke ×${S.bag.smoke}`,()=>item('smoke'),!S.bag.smoke],['Back',()=>{B.menu='main';renderActions()}]];
  box.innerHTML='';items.forEach(([label,fn,dis],i)=>{const b=document.createElement('button');b.className='btn'+(B.over?' seal':'');b.innerHTML=`<kbd>${i+1}</kbd>${label}`;
    b.disabled=!!dis||(B.busy&&!B.over);b.onclick=()=>{if(B&&(B.over||!B.busy))fn()};box.appendChild(b)});
}
function hitMonster(d,col,big){B.m.hp=Math.max(0,B.m.hp-d);B.shake=.3;B.flash=.14;fx(String(d),320+rnd(-24,24),210,col||'#ffffff',big)}
function physical(mult){let d=Math.max(1,Math.round(atk()*mult*rnd(.85,1.15)-B.m.def*.5));const c=Math.random()<crit();if(c)d=Math.round(d*1.75);return [d,c]}
function actAttack(){const [d,c]=physical(1);B.slash=.25;hitMonster(d,c?'#ffd34a':null,c);log(c?`Critical hit! ${d} damage.`:`You strike for ${d} damage.`);after()}
function skill(s){
  if(s==='power'){S.mp-=4;const [d,c]=physical(1.8);B.slash=.3;hitMonster(d,'#ffb347',true);log(`Power Strike${c?' (critical)':''} deals ${d}!`)}
  if(s==='fire'){S.mp-=5;const d=Math.round(spell()*rnd(.9,1.1)*(B.m.undead?1.5:1));B.fire=.5;hitMonster(d,'#ff7a3a',!!B.m.undead);log(B.m.undead?`Holy fire scorches the undead for ${d}!`:`Fire burns for ${d} damage.`)}
  if(s==='heal'){S.mp-=6;const h=Math.min(maxHP()-S.hp,12+S.st.int*4);S.hp+=h;fx('+'+h,320,420,'#9bd36a',true);log(`You heal ${h} HP.`)}
  after();
}
function item(k){
  if(k==='smoke'){S.bag.smoke--;log('You vanish in a puff of smoke.');flee();return}
  S.bag[k]--;if(k==='potion'){const h=Math.min(maxHP()-S.hp,40);S.hp+=h;fx('+'+h,320,420,'#9bd36a',true);log(`The draught restores ${h} HP.`)}
  else{const h=Math.min(maxMP()-S.mp,20);S.mp+=h;fx('+'+h+' MP',320,420,'#6aa8ff',true);log(`The tonic restores ${h} MP.`)}
  after();
}
function actRun(){const ch=clamp(.5+(S.st.agi-B.m.agi)*.05,.2,.9);if(Math.random()<ch){log('You got away safely.');flee()}else{log("You couldn't escape!");after()}}
function flee(){B.over=true;B.fled=true;B.busy=false;hud();save();renderActions()}
function after(){B.menu='main';hud();if(B.m.hp<=0){win();return}B.busy=true;renderActions();setTimeout(enemyTurn,750)}
function enemyTurn(){
  if(!B||B.over)return;const m=B.m,sp=Math.random();let mult=1,hits=1,verb='attacks',leech=false;
  B.lunge=.3;
  if(m.id==='slime'&&sp<.2){log('The Slime wobbles in place.');B.busy=false;renderActions();return}
  if(m.id==='bee'&&sp<.22){mult=1.4;verb='stings you'}
  if(m.id==='boar'&&sp<.22){mult=1.6;verb='charges'}
  if(m.id==='goblin'&&sp<.18&&S.gold>0){const st=Math.min(S.gold,ri(3,8));S.gold-=st;m.g+=st;log(`The Goblin snatches ${st} g! Beat it to get it back.`);mult=.6}
  if(m.id==='bat'&&sp<.25){leech=true;verb='bites and drinks'}
  if(m.id==='skeleton'&&sp<.22){mult=1.3;verb='hurls a bone'}
  if(m.id==='wraith'&&sp<.25){const dr=Math.min(S.mp,ri(3,6));S.mp-=dr;mult=.7;verb=`drains ${dr} MP and strikes`}
  if(m.id==='werewolf'&&sp<.22){hits=2;mult=.75;verb='slashes twice'}
  let total=0;
  for(let i=0;i<hits;i++){if(Math.random()<dodge())continue;total+=Math.max(1,Math.round(m.atk*mult*rnd(.85,1.15)-defn()*.5))}
  if(total>0){S.hp-=total;B.pflash=.35;fx('-'+total,320,420,'#ff5a4e',true);log(`The ${m.n} ${verb} for ${total} damage.`);
    if(leech){const h=Math.round(total/2);m.hp=Math.min(m.maxhp,m.hp+h);log(`It regains ${h} HP.`)}}
  else log(`You dodge the ${m.n}'s attack!`);
  hud();
  if(S.hp<=0){S.hp=0;hud();B.over=true;B.lost=true;B.busy=false;log('You collapse in the grass...');renderActions();return}
  B.busy=false;renderActions();
}
function win(){
  const m=B.m;B.over=true;B.dying=true;B.busy=false;S.kills++;S.xp+=m.xp;S.gold+=m.g;
  log(`${m.n} defeated! +${m.xp} XP, +${m.g} g.`);
  if(Math.random()<.12){S.bag.potion++;log('It dropped a Healing Draught.')}
  let ups=0;while(S.xp>=xpNext(S.lv)){S.xp-=xpNext(S.lv);S.lv++;S.pts+=3;ups++}
  if(ups){S.hp=maxHP();S.mp=maxMP();B.leveled=true;log(`Level up! You are now level ${S.lv}. +${ups*3} talent points.`)}
  save();hud();renderActions();
}
function endBattle(){
  const lost=B.lost,lv=B.leveled;B=null;scene='explore';$('#battleUI').hidden=true;$('#controls').style.display='';
  if(lost){fade(()=>{S.gold=Math.floor(S.gold/2);S.hp=maxHP();S.mp=maxMP();S.time='day';S.checkedIn=false;S.map='inn';placePlayer(15,3,'up');save();hud()},()=>toast('You wake at the Sleeping Stag. Half your gold is gone.'));return}
  save();hud();if(lv)setTimeout(openStats,150);
}

  cx.globalAlpha=1;
  if(B.slash>0){cx.strokeStyle=`rgba(255,255,255,${B.slash*4})`;cx.lineWidth=6;cx.beginPath();cx.arc(300,240,70,-1.2,.3);cx.stroke();cx.beginPath();cx.arc(345,250,64,1.9,3.5);cx.stroke()}
  if(B.fire>0){const p=1-B.fire/.5;for(let i=0;i<18;i++){const a=i/18*Math.PI*2+hash(i,9),r=p*90*(.6+hash(i,3)*.6);cx.fillStyle=i%3?`rgba(255,${120+i*6},40,${1-p})`:`rgba(255,230,120,${1-p})`;circ(320+Math.cos(a)*r,260+Math.sin(a)*r*.8,10*(1-p)+3)}}
  for(const f of B.fx){f.t+=dt;cx.font=`700 ${f.big?30:24}px "Alegreya SC", Georgia, serif`;cx.textAlign='center';cx.globalAlpha=clamp(1.4-f.t*1.4,0,1);
    cx.lineWidth=5;cx.strokeStyle='#120c08';const y=f.y-f.t*46;cx.strokeText(f.s,f.x,y);cx.fillStyle=f.col;cx.fillText(f.s,f.x,y)}
  cx.globalAlpha=1;cx.textAlign='left';B.fx=B.fx.filter(f=>f.t<1);
  cx.restore();
  if(!B.dying){cx.fillStyle='rgba(42,29,20,.92)';cx.fillRect(176,12,288,54);cx.strokeStyle='#8a6a3e';cx.lineWidth=2;cx.strokeRect(177,13,286,52);
    cx.font='700 17px "Alegreya SC", Georgia, serif';cx.fillStyle='#efe3c4';cx.fillText(`Lv ${m.lv} ${m.n}`,190,35);
    if(m.undead){cx.fillStyle='#c9b8ff';cx.font='700 12px "Alegreya SC", Georgia, serif';cx.textAlign='right';cx.fillText('UNDEAD',450,34);cx.textAlign='left'}
    cx.fillStyle='#120c08';cx.fillRect(190,45,260,10);cx.fillStyle='#b8402f';cx.fillRect(190,45,260*m.hp/m.maxhp,10)}
  if(B.pflash>0){cx.fillStyle=`rgba(200,30,30,${B.pflash*.6})`;cx.fillRect(0,0,W,H)}
  if(B.intro>0){cx.fillStyle=`rgba(255,255,255,${B.intro})`;cx.fillRect(0,0,W,H)}
  B.shake=Math.max(0,B.shake-dt);B.flash=Math.max(0,B.flash-dt);B.pflash=Math.max(0,B.pflash-dt);B.lunge=Math.max(0,B.lunge-dt);
  B.slash=Math.max(0,B.slash-dt);B.fire=Math.max(0,B.fire-dt);B.intro=Math.max(0,B.intro-dt*2.2);if(B.dying)B.alpha-=dt*1.6;
}

/* =================== LOOP & INPUT =================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(scene==='explore'){
    if(P.moving){P.t+=dt/.17;if(P.t>=1){P.t=1;P.moving=false;arrive()}}
    if(!P.moving&&canMove()&&held.length)tryMove(held[held.length-1]);
    renderExplore();
  }else if(B)renderBattle(dt);
  requestAnimationFrame(frame);
}
const KEYDIR={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(modalOpen()){if(e.code==='Escape')closeModal();return}
  if(scene==='battle'){const n=parseInt(e.key,10);if(n>=1&&n<=4){const b=$('#actions').children[n-1];if(b&&!b.disabled)b.click();e.preventDefault()}
    if(e.code==='Escape'&&B&&B.menu!=='main'&&!B.busy){B.menu='main';renderActions()}return}
  const d=KEYDIR[e.code];if(d){e.preventDefault();if(!held.includes(d))held.push(d);return}
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();interact()}
  if(e.code==='KeyC')openStats();if(e.code==='KeyB')openBag();
});
addEventListener('keyup',e=>{const d=KEYDIR[e.code];if(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1)}});
addEventListener('blur',()=>held.length=0);
document.querySelectorAll('.dpad button').forEach(b=>{const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(!held.includes(d))held.push(d)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1)}))});
$('#aBtn').addEventListener('click',interact);
$('#bStats').addEventListener('click',openStats);$('#bBag').addEventListener('click',openBag);

hud();requestAnimationFrame(frame);
if(fresh)openIntro();
</script>
