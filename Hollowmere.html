<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollowmere</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+SC:wght@500;700&family=Jacquard+24&display=swap">
<style>
/* Layout: one walnut-framed game window — HUD strip, canvas stage, then controls or battle menu; dialogs are parchment */
:root{
  --bg:#130e0a; --wood:#2a1d14; --wood2:#3a281a; --line:#5c4128; --trim:#8a6a3e;
  --ink:#efe3c4; --dim:#b29d78; --parch:#eadbb4; --parch2:#d9c595; --pink:#3a2616; --pdim:#6e5537;
  --ox:#8b2e24; --gold:#d4a23c; --hp:#b8402f; --mp:#3f6fc0; --xp:#8aa53a; --night:#a9a2e0;
  --display:'Jacquard 24','UnifrakturMaguntia',Georgia,serif; --sc:'Alegreya SC',Georgia,serif; --body:'Alegreya',Georgia,serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0}
body{font-family:var(--body);font-size:17px;line-height:1.4;padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at top,#211710,var(--bg) 70%) var(--bg)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{font-family:var(--sc);font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--ink);
  background:linear-gradient(#5d4027,#45301d);border:2px solid #1e140d;box-shadow:inset 0 1px 0 #7d5a36,0 2px 0 #1e140d;
  border-radius:3px;padding:8px 13px;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:8px;position:relative}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 #7d5a36}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:13px;padding:5px 10px}
.btn.seal{background:linear-gradient(#a3372b,#7a271e);box-shadow:inset 0 1px 0 #c25446,0 2px 0 #3d120d}
kbd{font-family:var(--sc);font-size:11px;color:var(--dim);border:1px solid #6b4c30;padding:0 4px;border-radius:2px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:linear-gradient(#33231a,#261a12);
  border:3px solid var(--line);box-shadow:inset 0 0 0 1px var(--trim),0 3px 0 #0b0806;padding:10px 12px;border-radius:4px}
.id{display:flex;align-items:center;gap:12px}
.lvl{display:grid;place-items:center;width:50px;height:50px;border-radius:47% 53% 50% 50%/52% 46% 54% 48%;
  background:radial-gradient(circle at 38% 34%,#b8453a,#7a251c 70%);box-shadow:0 0 0 3px #5e1b14,inset 0 -3px 0 #5e1b14;line-height:1;text-align:center}
.lvl .lbl{display:block;font-size:10px;color:#f3d9a8;letter-spacing:.12em}
.lvl b{font-family:var(--sc);font-size:20px;color:#fbe7b8}
.where{display:flex;flex-direction:column;gap:2px}
#hPlace{font-family:var(--display);font-size:26px;line-height:1;color:var(--gold)}
.time{font-family:var(--sc);font-size:12px;letter-spacing:.1em;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase}
.time::before{content:"";width:10px;height:10px;border-radius:50%}
.time.day{color:var(--gold)} .time.day::before{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.time.night{color:var(--night)} .time.night::before{box-shadow:inset -3px -1px 0 0 var(--night)}
.bars{flex:1 1 220px;min-width:0;display:grid;gap:5px}
.row{display:grid;grid-template-columns:24px 1fr 72px;gap:8px;align-items:center}
.lbl{font-family:var(--sc);font-size:12px;color:var(--dim);letter-spacing:.06em}
.bar{height:11px;background:#120c08;border:1px solid #6b4c30;overflow:hidden;border-radius:2px}
.bar i{display:block;height:100%;transition:width .25s;box-shadow:inset 0 2px 0 rgba(255,255,255,.18)}
.bar.hp i{background:var(--hp)} .bar.mp i{background:var(--mp)} .bar.xp i{background:var(--xp)}
.num{font-family:var(--sc);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gold{font-family:var(--sc);font-weight:700;font-size:16px;color:var(--gold);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--sc);font-weight:700;font-size:14px;color:var(--ink);background:#1a120c;border:1px solid #6b4c30;border-radius:3px;padding:1px 8px;margin-right:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #9a6f22}
.hbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.badge{position:absolute;top:-8px;right:-8px;background:var(--xp);color:#1b230a;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}

/* Stage */
.stage{position:relative;border:3px solid var(--line);box-shadow:inset 0 0 0 1px var(--trim),0 0 0 1px #0b0806;background:#000;line-height:0;border-radius:3px;overflow:hidden}
canvas{width:100%;height:auto;display:block;touch-action:none}
#fade{position:absolute;inset:0;background:#05040a;opacity:0;pointer-events:none;transition:opacity .4s}

/* Battle */
.battle{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px}
.log{background:linear-gradient(var(--parch),var(--parch2));color:var(--pink);border:3px solid var(--line);border-radius:3px;padding:10px 14px;min-height:124px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:16px}
.log p{margin:0;color:var(--pdim)} .log p:last-child{color:var(--pink);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.actions .btn{min-height:48px}

/* Touch */
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 6px}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.dpad button,.abtn{font-family:var(--sc);color:var(--ink);background:linear-gradient(#5d4027,#45301d);border:2px solid #1e140d;box-shadow:inset 0 1px 0 #7d5a36;border-radius:4px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad .u{grid-area:1/2} .dpad .l{grid-area:2/1} .dpad .r{grid-area:2/3} .dpad .d{grid-area:3/2}
.dpad button:active,.abtn:active{filter:brightness(1.25)}
.xbtn{background:radial-gradient(circle at 38% 34%,#7d8a96,#4a525c 70%)!important;color:#f3ead0!important;width:64px!important;height:64px!important;margin-bottom:24px}
.abtn{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#b8453a,#7a251c 70%);color:#fbe7b8;font-size:24px}
.keys{margin:0;font-family:var(--sc);font-size:13px;color:var(--dim);letter-spacing:.03em;display:flex;flex-wrap:wrap;gap:6px 18px}
@media (hover:hover) and (pointer:fine){ .controls{display:none} }
@media not ((hover:hover) and (pointer:fine)){ .keys{display:none} }
@media (max-width:520px){ .battle{grid-template-columns:1fr} .log{min-height:96px} #hPlace{font-size:22px} }

/* Parchment dialogs */
.modal{position:fixed;inset:0;background:rgba(8,5,3,.7);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{width:min(500px,100%);max-height:86vh;overflow:auto;color:var(--pink);
  background:radial-gradient(ellipse at center,var(--parch) 55%,var(--parch2));border:3px solid var(--line);
  box-shadow:0 0 0 5px #20160f,0 0 0 7px var(--trim),0 12px 40px rgba(0,0,0,.6);border-radius:3px;padding:20px;display:flex;flex-direction:column;gap:11px}
.mbox h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--ox)}
.mbox h3{font-family:var(--sc);font-size:14px;color:var(--pdim);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #b89c68;padding-bottom:3px;margin-top:4px}
.mbox p{margin:0;max-width:62ch}
.say{font-style:italic}
.sub{color:var(--pdim);font-size:16px}
.g{color:#7a5314}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:4px 0;border-bottom:1px dotted #b89c68}
.item b{font-family:var(--sc);font-size:16px}
.item small{display:block;color:var(--pdim);font-size:15px}
.price{font-family:var(--sc);font-weight:700;font-size:15px;color:#7a5314;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:minmax(0,1fr) 34px auto;gap:10px;align-items:center;padding:3px 0;border-bottom:1px dotted #b89c68}
.stat b{font-family:var(--sc);font-size:16px}
.stat .v{font-family:var(--sc);font-weight:700;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 16px;font-size:16px}
.derived span{color:var(--pdim)} .derived b{font-family:var(--sc);float:right}
.pts{background:#f3e7c4;border:1px dashed var(--ox);color:var(--ox);padding:7px 10px;font-family:var(--sc);font-weight:700;font-size:15px;border-radius:3px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--parch);color:var(--pink);border:3px solid var(--line);box-shadow:0 0 0 2px var(--trim);padding:9px 18px;font-family:var(--sc);font-weight:700;font-size:15px;border-radius:3px;max-width:min(90vw,480px);text-align:center}
@media (prefers-reduced-motion:reduce){ #fade,.bar i{transition:none} }
/* Satchel */
.mbox.wide{width:min(900px,100%)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.inv{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:16px;align-items:start}
.lcol{display:flex;flex-direction:column;gap:10px}
.doll{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;background:radial-gradient(ellipse at 50% 40%,#43301f,#211710 75%);
  border:3px solid var(--line);box-shadow:inset 0 0 0 1px var(--trim),0 3px 0 #0b0806;border-radius:4px;padding:12px 10px 10px;color:var(--ink)}
.dc{display:grid;gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:2px}
.cap{font-family:var(--sc);font-size:11px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.slot,.tile{position:relative;display:grid;place-items:center;cursor:pointer;color:var(--rc,#6b4c30);background:linear-gradient(#22170f,#140d08);
  border:2px solid var(--rc,#6b4c30);border-radius:4px;box-shadow:inset 0 0 10px rgba(0,0,0,.6),0 2px 0 #0b0806;padding:0}
.slot{width:58px;height:58px}
.slot svg{width:38px;height:38px}
.slot.empty{border-style:dashed;color:#6b4c30;--rc:#6b4c30}
.slot:hover,.tile:hover{filter:brightness(1.25)}
.slot:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.u5{border-color:transparent!important;background:radial-gradient(circle at 50% 45%,#3a2440,#140d14 75%) padding-box,linear-gradient(135deg,#ff4fd0,#8a5bff,#2fd8ff,#5dff9a,#ffe04a) border-box!important}
.ultx{background:linear-gradient(90deg,#c0158f,#5b3bd8,#0a8fb8,#1f9a50,#b07800);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.ultx.dk{background-image:linear-gradient(90deg,#ff6ad5,#a58bff,#5fe4ff,#7dffb0,#ffe05a)}
.slot.on,.tile.on{box-shadow:0 0 0 3px var(--gold),inset 0 0 12px rgba(0,0,0,.6)}
.fig{display:grid;place-items:center}
.fig img{width:120px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.dst{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:2px 12px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px;
  font-family:var(--sc);font-size:12px;color:var(--dim)}
.dst b{float:right;color:var(--ink);font-variant-numeric:tabular-nums}
.rcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.ph b{font-family:var(--sc);font-size:16px}
.flt{display:flex;gap:4px;margin-left:auto}
.chip{font-family:var(--sc);font-size:12px;color:var(--pink);background:transparent;border:1px solid #b89c68;border-radius:12px;padding:2px 10px;cursor:pointer}
.chip.on{background:var(--pink);color:var(--parch);border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;max-height:min(440px,52vh);overflow:auto;align-content:start;background:#2a1d14;border:3px solid var(--line);border-radius:4px;padding:8px}
.tile{aspect-ratio:1}
.tile svg{width:62%;height:62%}
.tile img.ico{width:86%;height:86%}
.slot img.ico{width:50px;height:50px}
.ic img.ico{width:38px;height:38px}
.slot:not(.empty),.tile{background:radial-gradient(circle at 50% 45%,#3a2a1c,#140d08 75%)}
.tile.fit{box-shadow:0 0 0 2px #e8c76a,0 0 10px #e8c76a}
.tile i{position:absolute;font-style:normal;font-family:var(--sc);font-weight:700;font-size:10px;line-height:1}
.tile .up{top:3px;right:4px;color:#9bd36a}
.tile .two{bottom:3px;right:4px;color:var(--dim)}
.legend{font-family:var(--sc);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.card{background:#f3e7c4;border:2px solid #b89c68;border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.card.hint{border-style:dashed}
.ch{display:flex;gap:10px;align-items:center}
.ic{display:grid;place-items:center;width:42px;height:42px;flex:none;color:var(--rc);background:#1a120c;border:2px solid var(--rc);border-radius:4px}
.ic svg{width:30px;height:30px}
.cn{font-family:var(--sc);font-size:17px;line-height:1.15;display:block}
.ch .sub{font-size:14px;display:block}
.cl{margin:2px 0 0;font-size:15px;padding-left:18px}
.cs{margin:2px 0 0;font-family:var(--sc);font-size:14px}
.cl .fx{font-style:italic;color:var(--ox)}
.dls{display:grid;gap:1px;font-size:14px}
.dl{display:grid;grid-template-columns:1fr auto 40px;gap:6px;border-bottom:1px dotted #b89c68}
.dl b{font-family:var(--sc);font-variant-numeric:tabular-nums}
.dl i{font-style:normal;font-family:var(--sc);font-weight:700;text-align:right}
.dl.pos i{color:#2f7a2a} .dl.neg i{color:#9a3a2a}
@media (max-width:700px){.inv{grid-template-columns:1fr}.slot{width:52px;height:52px}.fig img{width:100px}}

</style>
</head>
<body>


<div class="wrap">
  <header class="hud">
    <div class="id">
      <div class="lvl"><div><span class="lbl">LV</span><b id="hLv">1</b></div></div>
      <div class="where"><span id="hPlace">Hollowmere</span><span id="hTime" class="time day">Day</span></div>
    </div>
    <div class="bars">
      <div class="row"><span class="lbl">HP</span><div class="bar hp"><i id="hHPb"></i></div><span id="hHP" class="num"></span></div>
      <div class="row"><span class="lbl">MP</span><div class="bar mp"><i id="hMPb"></i></div><span id="hMP" class="num"></span></div>
      <div class="row"><span class="lbl">XP</span><div class="bar xp"><i id="hXPb"></i></div><span id="hXP" class="num"></span></div>
    </div>
    <div class="side">
      <div class="gold"><span id="hClock" class="clock">Mon 8:00 AM</span><i class="coin"></i><span id="hGold">0</span> g</div>
      <div class="hbtns">
        <button class="btn sm" id="bStats">Talents<span id="ptsBadge" class="badge" hidden>0</span></button>
        <button class="btn sm" id="bBag">Satchel</button>
        <button class="btn sm" id="bQuests">Quests<span id="qBadge" class="badge" hidden>!</span></button>
        <button class="btn sm" id="bMap">Map</button>
      </div>
    </div>
  </header>

  <div class="stage">
    <canvas id="cv" width="768" height="576" aria-label="Game world"></canvas>
    <div id="fade"></div>
  </div>

  <section class="battle" id="battleUI" hidden>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="actions" id="actions"></div>
  </section>

  <section class="controls" id="controls">
    <div class="dpad">
      <button class="u" data-d="up" aria-label="Up">▲</button>
      <button class="l" data-d="left" aria-label="Left">◀</button>
      <button class="r" data-d="right" aria-label="Right">▶</button>
      <button class="d" data-d="down" aria-label="Down">▼</button>
    </div>
    <div style="display:flex;gap:12px;align-items:flex-end"><button class="abtn xbtn" id="xBtn" aria-label="Attack">X</button><button class="abtn" id="aBtn" aria-label="Talk or search">A</button></div>
  </section>
  <p class="keys"><span>Move: WASD / Arrows</span><span>Talk · Search: Space</span><span>Attack: X</span><span>Talents: C</span><span>Satchel: B</span><span>Quests: Q</span><span>Map: M</span><span>Battle: 1–9</span></p>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#cv');let cx=cv.getContext('2d');const MAIN=cx;
let RS=2;
const TC=document.createElement('canvas');const tcx=TC.getContext('2d');
const TS2=document.createElement('canvas');const tsx=TS2.getContext('2d');
function outlined(X,Y,fn){tcx.setTransform(1,0,0,1,0,0);tcx.clearRect(0,0,TC.width,TC.height);tcx.setTransform(RS,0,0,RS,0,0);const keep=cx;cx=tcx;try{fn(32,64)}finally{cx=keep}
  tsx.setTransform(1,0,0,1,0,0);tsx.globalCompositeOperation='source-over';tsx.clearRect(0,0,TS2.width,TS2.height);tsx.drawImage(TC,0,0);tsx.globalCompositeOperation='source-in';tsx.fillStyle='rgba(18,10,5,.72)';tsx.fillRect(0,0,TS2.width,TS2.height);
  const ox=X-32,oy=Y-64;for(const [a,b] of [[-1,0],[1,0],[0,-1],[0,1]])cx.drawImage(TS2,ox+a,oy+b,96,112);cx.drawImage(TC,ox,oy,96,112)}
const OUTL_IN=new Set('CBQnbxsTcMWSPAYFGVLOHzuE'),OUTL_OUT=new Set('bxkhFPLOAlNj');
const TS=32, W=768, H=576;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(x,y,k=0){let h=(x*374761393+y*668265263+k*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;}

/* =================== WORLD =================== */
const BUILDINGS=[
  {x:4,y:4,w:8,h:7,roof:'thatch',door:7,kind:'inn',sign:'INN',shutter:'#3f6b35',chimney:1,to:{map:'inn',x:6,y:12}},
  {x:14,y:6,w:5,h:5,roof:'thatch',door:16,kind:'house',shutter:'#2f5f8a',chimney:1,msg:'Locked. Someone inside is snoring loudly.'},
  {x:26,y:4,w:8,h:7,roof:'tile',door:29,kind:'shop',sign:'SHOP',shutter:'#8b2e24',chimney:1,to:{map:'shop',x:7,y:12}},
  {x:36,y:6,w:5,h:5,roof:'tile',door:38,kind:'house',shutter:'#3f6b35',msg:'Locked. A cat stares at you from the window.'},
  {x:5,y:20,w:7,h:7,roof:'slate',door:8,kind:'chapel',to:{map:'chapel',x:7,y:12}},

function bountyQ(){const b=BOUNTIES[S.bnt%BOUNTIES.length],n=b[1]+Math.floor(S.bnt/BOUNTIES.length)*2;
  return {giver:'guildmaster',repeat:1,title:`Bounty: ${b[2]}`,need:{kill:b[0],n,label:b[2]+' slain'},reward:{gold:60+n*22+S.bnt*12,xp:40+n*14+S.bnt*8},
    offer:`"Fresh bounty on the board: ${n} ${b[2]} out in ${b[3]}. The Guild pays on proof."`,ready:'"Clean work. Here\'s your purse. The Guild remembers who gets things done."',desc:`Slay ${n} ${b[2]} in ${b[3]}. (Repeatable bounty #${S.bnt+1})`}}
const QUESTS={
  sirens:{giver:'elder',title:'Songs on the Rocks',need:{kill:'siren',n:6,label:'Sirens silenced'},reward:{gold:300,xp:400,skill:'tidal'},
    offer:'"Sirens lure our fishermen onto the rocks every night. Silence six of them, and I will teach you the old tide-magic of Saltmere."',ready:'"The nights are quiet again. Come, feel the pull of the tide in your hands."',desc:'Defeat 6 Sirens along the Stormcoast.'},
  tidequeen:{giver:'elder',req:'sirens',title:'The Drowned Crown',need:{item:'tidepearl',n:1},reward:{gold:1000,stat:{int:4,vit:2}},
    offer:'"The Tide Queen rises from her grotto south of the west road. Bring me her pearl, and Saltmere will sing your name for a hundred years."',ready:'"Her pearl. The sea is ours again. Bless you, stranger."',desc:"Defeat the Tide Queen in her grotto on the Stormcoast and bring back her pearl."},
  bait:{giver:'fisher',title:'Bait for the Big Ones',need:{item:'toadleg',n:5},reward:{gold:150,hipotion:3},
    offer:'"Reef toad legs make the best bait there is. Bring me 5 and I\'ll make it worth your while."',ready:'"Perfect! The tuna won\'t know what hit them."',desc:'Collect 5 Toad Legs from Reef Toads on the Stormcoast (or Bog Toads in the marsh).'},
  snapjaw:{giver:'keeper',title:'The Thing in the Cove',need:{item:'snapclaw',n:1},reward:{gold:400,art:'tidecaller'},
    offer:'"Old Snapjaw lives in the cove south of the village. Ate my nets, my boat, and my brother\'s boots. Bring me its claw, and you can have the trident my father pulled from the sea."',ready:'"Ha! That\'s the claw that took my boat. Here. Tidecaller is yours."',desc:'Slay Old Snapjaw in the cove south of Saltmere and bring back its claw.'},
  pearls:{giver:'peddler',title:'Pearls for Fennick',need:{item:'pearl',n:3},reward:{gold:200,trinket:16},
    offer:'"Black pearls! A buyer in the capital pays a fortune. Bring me 3 and I\'ll trade you something very special from my pack."',ready:'"Gorgeous. And as promised: the Pearl of the Deep. Don\'t ask where I got it."',desc:'Collect 3 Black Pearls. Mudlings in the marsh and the drowned on the coast sometimes carry them.'},
  wolves:{giver:'trapper',title:'Thin the Pack',need:{kill:'frostwolf',n:6,label:'Frost Wolves slain'},reward:{gold:350,xp:500,skill:'warcry'},
    offer:'"The frost wolves are getting bold. Six of them, and I\'ll teach you the hunter\'s war cry. Freezes a wolf\'s blood. Works on people too."',ready:'"Good hunting. Now fill your lungs and let it out. Louder. LOUDER."',desc:'Defeat 6 Frost Wolves in Frostpeak Tundra.'},
  palefang:{giver:'trapper',req:'wolves',title:'The Pale Wolf',need:{item:'palepelt',n:1},reward:{gold:500,stat:{agi:3}},
    offer:'"Now the real hunt. Palefang leads them all. It dens west of here among the snow pines. Bring me its pelt."',ready:'"Palefang\'s pelt. I never thought I\'d see it. You\'re faster than any wolf now."',desc:'Hunt down Palefang in the western tundra and bring back its pelt.'},
  titanheart:{giver:'bjorn',title:'A Heart of Ice',need:{item:'frostheart',n:1},reward:{gold:900,art:'frostbrand'},
    offer:'"The Frost Titan sleeps at the summit, north up the road. Bring me its frozen heart and I will give you Frostbrand, the blade my clan forged for that very fight."',ready:'"You did it. You actually did it. Take the blade. My clan would want it in your hands."',desc:'Defeat Ymrir the Frost Titan at Frostpeak Summit and bring back its heart.'},
  raiders:{giver:'caravan',title:'Raiders on the Road',need:{kill:'bandit',n:6,label:'Desert Raiders defeated'},reward:{gold:400,xp:550,skill:'whirl'},
    offer:'"Six raiders. That\'s all I ask. Do it, and I\'ll teach you how we fight when we\'re surrounded."',ready:'"The road is safer already. Now: plant your feet, and spin."',desc:'Defeat 6 Desert Raiders in the Sunscorch Desert.'},
  queen:{giver:'caravan',req:'raiders',title:'Crown of Stings',need:{item:'scorpcrown',n:1},reward:{gold:600,stat:{str:3}},
    offer:'"The Scorpion Queen\'s nest is north-east of here. Kill her and the desert breathes easier. Bring me her crown as proof."',ready:'"Her crown! The caravans will run again. You have my thanks, and my gold."',desc:'Slay Sekhet the Scorpion Queen in the north-east desert and bring back her crown.'},
  pharaoh:{giver:'sage',title:'The Sun That Never Sets',need:{item:'deathmask',n:1},reward:{gold:1200,skill:'sunfire',art:'sunscepter'},
    offer:'"The Pharaoh\'s tomb lies at the end of the east road. End his curse and bring me his mask, and I will teach you to call down the sun itself."',ready:'"The mask is cold at last. Open your hands. Feel the sun."',desc:"Defeat the Sand Pharaoh in his tomb at the end of the desert road and bring back his death mask."},
  imps:{giver:'priestess',title:'Ember Thieves',need:{kill:'imp',n:8,label:'Fire Imps defeated'},reward:{gold:450,xp:600,skill:'execute'},
    offer:'"Fire imps steal our embers. Destroy eight of them, and I will teach you how the Ashwalkers end a fight."',ready:'"Eight. Good. When your foe is weak, do not hesitate. Strike once, and strike true."',desc:'Defeat 8 Fire Imps in the Emberfall Wastes.'},
  cinder:{giver:'priestess',req:'imps',title:'The Furnace Golem',need:{item:'cinderheart',n:1},reward:{gold:700,stat:{vit:4}},
    offer:'"Cinderjaw walks the south of the wastes, burning everything it touches. Bring me its heart."',ready:'"The mountain is grateful. And so am I."',desc:'Slay Cinderjaw in the southern Emberfall Wastes and bring back its heart.'},
  core:{giver:'ashsmith',title:'Heart of the Mountain',need:{item:'moltencore',n:1},reward:{gold:1000,art:'emberplate'},
    offer:'"Ignarax carries a core of living fire. Bring it to me, and I\'ll forge you armor that drinks flame."',ready:'"Ha! Still warm. Give me a moment... There. Emberheart Plate. Nothing like it in the world."',desc:'Defeat Ignarax at the Cinder Throne and bring her Molten Core to Korrum.'},
  hermit:{giver:'hermit',title:'Restless Waters',need:{kill:'wraith',n:6,label:'Wraiths banished'},reward:{gold:250,xp:350,skill:'shadow'},
    offer:'"Wraiths drift over the lake at night, wailing. Banish six of them, and I will show you how to move like a shadow."',ready:'"Silence, at last. Now watch closely. Step where they do not look."',desc:'Banish 6 Wraiths. They walk the meadows at night and haunt the Darkwood.'},
  ratking:{giver:'lord',title:'The King Beneath',need:{item:'ratcrown',n:1},reward:{gold:450,stat:{vit:3}},
    offer:'"Something has made itself a king in our sewers. The rats obey it and grow bolder by the day. Go down through the grate in the market square, slay this Rat King, and bring me its crown."',
    ready:'"By the gods, it\'s real! Aldermoor owes you a debt. Take this, with my thanks."',desc:'Enter the sewers through the grate in the Aldermoor market and defeat the Rat King.'},
  warden:{giver:'bishop',title:'Silence the Crypt',need:{item:'wardenskull',n:1},reward:{gold:650,stat:{int:3}},
    offer:'"The crypt beneath this cathedral has woken. The Bone Warden, champion of a dead age, walks again, and the dead rise at his call. The stairs are beside the altar. Lay him to rest."',
    ready:'"The skull of the Warden. The crypt grows quiet at last. Bless you, child of the dawn."',desc:'Take the stairs beside the cathedral altar down into the crypt and destroy the Bone Warden.'},
  embers:{giver:'alchemist',title:'Embers for Wren',need:{item:'ember',n:3},reward:{gold:80,text:'Elixir and Fire Flask recipes'},
    offer:'"I\'m working on a new brew, but I\'m out of Wisp Embers. Bring me 3 from the wisps of Murkfen Marsh (they only come out at night) and I\'ll teach you my best recipes."',
    ready:'"Still warm! Wonderful. From now on I can brew Elixirs and Fire Flasks for you."',desc:"Collect 3 Wisp Embers from the Will-o'-Wisps of Murkfen Marsh. They only appear at night."},
  ore:{giver:'smith',title:'Ore for the Forge',need:{item:'ore',n:6},reward:{gold:150,text:'advanced trinket recipes'},
    offer:'"My forge is hungry and the mines are overrun. Bring me 6 Copper Ore from the Kobold Miners in the Ashen Crags and I\'ll show you what I can really make."',
    ready:'"Good ore! Now I can forge proper trinkets for you. Bring me the parts and I\'ll do the rest."',desc:'Collect 6 Copper Ore from Kobold Miners in the Ashen Crags.'},
  cask:{giver:'barkeep',title:'A Cask Gone Astray',need:{item:'cask',n:1},reward:{gold:120,hipotion:2},
    offer:'"Some fool rolled our best cask of Goose Gold down the cellar chute, and it washed into the sewers! Find it for me? It\'s marked with a golden goose."',
    ready:'"My cask! Not even a dent. Drinks are on the house. Well, for today."',desc:'Search the crates in the Aldermoor Sewers for the Gilded Goose\'s lost ale cask.'},
  cat:{giver:'pip',title:'Whiskers!',need:{item:'cat',n:1},reward:{gold:30,stat:{vit:2}},
    offer:'"Whiskers chased a rat down the big grate in the market and he hasn\'t come back! Please, can you find him?"',
    ready:'"WHISKERS! You found him! Here, take my savings. And Mama says you can have a slice of her famous pie. It makes you strong!"',desc:"Find Pip's orange cat Whiskers somewhere in the Aldermoor Sewers."},
  pages:{giver:'librarian',title:'The Torn Tome',need:{item:'page',n:3},reward:{gold:200,skill:'frost'},
    offer:'"The Tome of Winter was stolen and torn apart by grave robbers. Three of its pages are hidden in chests in the cathedral crypt. Recover them and I will teach you its spell for free."',
    ready:'"All three pages! Let me show you. Breathe in, and think of the coldest night you know..."',desc:'Search the chests in the cathedral crypt for 3 Torn Pages.'},

  ham:{giver:'innkeeper',title:'Stew for the Stag',need:{item:'ham',n:4},reward:{gold:50,potion:2},
    offer:'"My stew pot\'s empty and the regulars are grumbling! Bring me 4 Boar Hams from the meadow boars and I\'ll pay you well."',
    ready:'"Look at those hams! The Stag\'s stew is saved. Here, take this."',desc:'Wild Boars roam the meadows by day. Collect 4 Boar Hams.'},
  silk:{giver:'merchant',title:'Silk for Marrow',need:{item:'silk',n:3},reward:{gold:120,ether:2},
    offer:'"Spider Silk! Strongest thread there is, and a tailor in the capital pays a fortune for it. Fetch me 3 from the Dire Spiders of the Darkwood."',
    ready:'"Beautiful! Strong as wire. A deal\'s a deal."',desc:'Dire Spiders nest in the Darkwood, north-west of town. Collect 3 Spider Silk.'},
  undead:{giver:'priest',title:'Rest for the Restless',need:{kills:'undead',n:6},reward:{gold:60,skill:'smite'},
    offer:'"The dead do not rest easy in these lands. Lay six of them to rest, and I will teach you the holy art of Smite."',
    ready:'"Six souls freed. Kneel, and receive the light."',desc:'Defeat 6 undead: skeletons, wraiths or ghouls. They walk the meadows at night, the Darkwood, and the Ruins of Varn.'},
  locket:{giver:'maud',title:"Maud's Locket",need:{item:'locket',n:1},reward:{gold:40,stat:{agi:2}},
    offer:'"Oh, dearie. A wicked Marsh Hag snatched my silver locket while I was gathering herbs in Murkfen Marsh. It holds my late husband\'s portrait..."',
    ready:'"My locket! Bless you, child. Take my old lucky charm. It always made me quick on my feet."',desc:'Find a Marsh Hag in Murkfen Marsh, south-west of town, and take back the Silver Locket.'},
  fang:{giver:'hunter',title:'Alpha of the Darkwood',need:{item:'fang',n:1},reward:{gold:250,stat:{str:3}},
    offer:'"Name\'s Kael. Twenty years I\'ve hunted these lands, and one beast still beats me: Greyfang, alpha of the Darkwood. He dens at the standing stones. Bring me his fang."',
    ready:'"By the old gods, you did it! Greyfang\'s own fang. Here, let me show you how to put your back into a swing."',desc:'Greyfang dens in the standing-stone circle deep in the Darkwood. Defeat him and bring back his fang.'},
  heart:{giver:'hunter',req:'fang',title:'Heart of the Mountain',need:{item:'heart',n:1},reward:{gold:400,stat:{def:3}},
    offer:'"Next challenge, if you\'ve the nerve. A Stone Colossus stomps about the top of the Ashen Crags. Its heart is a gem the size of your fist."',
    ready:'"The Heart of Stone! You\'re the finest hunter I\'ve ever met. This old trick will toughen your hide."',desc:'Follow the trail east from the south road into the Ashen Crags and defeat the Stone Colossus at the summit.'},
  king:{giver:'priest',req:'undead',title:'The Hollow King',need:{item:'crown',n:1},reward:{gold:800,stat:{str:2,def:2,vit:2,agi:2,int:2}},
    offer:'"You carry the light now. In the Ruins of Varn, north-east of town, the Hollow King still sits his throne, cursed and undying. End him, and bring me his crown so it can be blessed and buried."',
    ready:'"The crown of Varn. At last the old king can rest. The dawn\'s blessing is yours."',desc:'Defeat the Hollow King on his throne in the Ruins of Varn and bring back the Hollow Crown.'}};

function mobFree(mb,x,y){const M=MAPS[mb.map];if(x<1||y<1||x>=M.w-1||y>=M.h-1)return false;if(terrainSolid(mb.map,x,y))return false;
  if(S.map===mb.map&&P.x===x&&P.y===y)return false;if(npcAt(x,y)||bossAt(x,y))return false;if(MOBS.some(o=>o!==mb&&(o.x===x&&o.y===y||o.moving&&o.fx===x&&o.fy===y)))return false;
  if(M.outdoor){const z=ZONE[y][x];if(z===1||z===6||z!==mb.zone)return false;const t=tileAt(mb.map,x,y);if(t==='V'||t==='Q')return false}else{const t=tileAt(mb.map,x,y);if('<>D'.includes(t))return false}
  return true}
function viewTiles(){const M=MAPS[S.map];const cw=Math.ceil(W/TS),ch=Math.ceil(H/TS);return [P.x-(cw>>1)-1,P.y-(ch>>1)-1,P.x+(cw>>1)+1,P.y+(ch>>1)+1]}
function spawnCell(m,ci,cj,visible){const key=m+':'+ci+','+cj;const st=CELLS.get(key);if(st&&(st.live||!st.until||T<st.until||visible))return;
  const M=MAPS[m],x0=ci*CS,y0=cj*CS,el=[],road=[];
  for(let y=y0;y<y0+CS&&y<M.h;y++)for(let x=x0;x<x0+CS&&x<M.w;x++){const zn=mobEligible(m,x,y);if(zn)el.push([x,y,zn]);
    else if(M.outdoor&&'=~B'.includes(tileAt(m,x,y))){const z=ZONE[y][x];if(z!==1&&z!==6&&ENCZ[z])road.push([x,y,ENCZ[z][1]])}}
  const groups=[];const dens=el.length/(CS*CS);
  if(el.length>=10){const p=M.outdoor?Math.min(.42,.08+dens*.38):.38;if(Math.random()<p)groups.push(pick(el));if(el.length>48&&Math.random()<p*.25)groups.push(pick(el))}
  if(road.length>=4&&M.outdoor&&Math.hypot(x0-OX-22,y0-OY-16)>26&&Math.hypot(x0-CX-31,y0-CY-24)>30&&Math.random()<.07)groups.push([...pick(road),1]);
  CELLS.set(key,{live:0,until:0});
  for(const g of groups){const [x,y,zn,isRoad]=g;if(Math.abs(x-P.x)+Math.abs(y-P.y)<7)continue;
    const mb={id:++MID,map:m,cell:key,x,y,fx:x,fy:y,t:1,moving:false,dir:Math.random()<.5?'left':'right',home:[x,y],zone:M.outdoor?ZONE[y][x]:0,zn,wait:Math.random()*3,step:0};
    if(isRoad){mb.mons=banditGroup(zn);mb.person=1;mb.guard=1;mb.aggro=1}
    else{const a=rollMon(zn);mb.mons=[a];if(Math.random()<(S.lv>=4?.22:.08)){const b2=rollMon(zn);mb.mons.push(b2)}mb.aggro=AGGRO.has(a.id);mb.guard=Math.random()<.3}
    if(!mobFree(mb,x,y))continue;MOBS.push(mb);CELLS.get(key).live++}}
function mobStep(mb,nx,ny,spd){mb.dir=nx>mb.x?'right':nx<mb.x?'left':mb.dir;mb.fx=mb.x;mb.fy=mb.y;mb.x=nx;mb.y=ny;mb.t=0;mb.moving=true;mb.spd=spd;mb.step++}
function engage(mb){if(scene!=='explore'||B)return;held.length=0;mb.engaged=1;const mons=mb.mons.map(q=>({...q}));startBattle(mb.zn,null,{mons,mob:mb});if(B)B.mob=mb}
function updateMobs(dt){
  if(MOBMAP!==S.map||MOBTIME!==S.time){MOBS=[];for(const [k,v] of CELLS)v.live=0;MOBMAP=S.map;MOBTIME=S.time}
  const M=MAPS[S.map];if(!(M.outdoor||M.enc))return;
  MOBTICK-=dt;if(MOBTICK<=0){MOBTICK=.4;const [vx0,vy0,vx1,vy1]=viewTiles(),mg=CS;
    for(let cj=Math.floor((vy0-mg)/CS);cj<=Math.floor((vy1+mg)/CS);cj++)for(let ci=Math.floor((vx0-mg)/CS);ci<=Math.floor((vx1+mg)/CS);ci++){if(ci<0||cj<0)continue;
      const inView=ci*CS+CS>vx0&&ci*CS<vx1&&cj*CS+CS>vy0&&cj*CS<vy1;spawnCell(S.map,ci,cj,inView)}
    MOBS=MOBS.filter(mb=>{const far=Math.abs(mb.x-P.x)>vx1-vx0+CS*1.5||Math.abs(mb.y-P.y)>vy1-vy0+CS*1.5;if(far&&!mb.chase){const c=CELLS.get(mb.cell);if(c)c.live=Math.max(0,c.live-1);
      if(c&&!c.live)CELLS.delete(mb.cell);return false}return true})}
  if(scene!=='explore'||modalOpen()||fading||MMODE===2)return;
  const night=isNightNow();
  for(const mb of MOBS){if(mb.moving){mb.t+=dt/mb.spd;if(mb.t>=1){mb.t=1;mb.moving=false}else continue}
    const d=Math.abs(mb.x-P.x)+Math.abs(mb.y-P.y);
    if(mb.chase&&d===1&&!P.moving&&T>MOBGRACE){mb.dir=P.x>mb.x?'right':P.x<mb.x?'left':mb.dir;engage(mb);return}
    const sense=(mb.person?4:night?5:4)+(mb.chase?5:0);
    if(mb.aggro&&T>MOBGRACE&&T>(mb.calm||0)&&d<=sense&&!FREEZE){if(!mb.chase){mb.chase=1;mb.alert=1.2}
      const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[mb.x+dx,mb.y+dy]).filter(([x,y])=>mobFree(mb,x,y)).sort((a,b2)=>Math.abs(a[0]-P.x)+Math.abs(a[1]-P.y)-Math.abs(b2[0]-P.x)-Math.abs(b2[1]-P.y));
      if(opts.length&&Math.abs(opts[0][0]-P.x)+Math.abs(opts[0][1]-P.y)<d)mobStep(mb,opts[0][0],opts[0][1],mb.person?.24:.27);else{mb.stuck=(mb.stuck||0)+dt;if(mb.stuck>2){mb.chase=0;mb.calm=T+3;mb.stuck=0}}continue}
    if(mb.chase){mb.chase=0}
    mb.wait-=dt;if(mb.wait>0)continue;mb.wait=mb.guard?2+Math.random()*3:1+Math.random()*2.5;
    if(mb.guard&&Math.abs(mb.x-mb.home[0])+Math.abs(mb.y-mb.home[1])===0){if(Math.random()<.5)mb.dir=mb.dir==='left'?'right':'left';continue}
    const back=Math.abs(mb.x-mb.home[0])+Math.abs(mb.y-mb.home[1])>(mb.guard?0:4);
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5).map(([dx,dy])=>[mb.x+dx,mb.y+dy]).filter(([x,y])=>mobFree(mb,x,y)&&(MAPS[mb.map].outdoor?!!mobEligible(mb.map,x,y)||mb.person:true));
    if(back)dirs.sort((a,b2)=>Math.abs(a[0]-mb.home[0])+Math.abs(a[1]-mb.home[1])-Math.abs(b2[0]-mb.home[0])-Math.abs(b2[1]-mb.home[1]));
    if(dirs.length)mobStep(mb,dirs[0][0],dirs[0][1],.5)}}
function mobAfter(mb,lost,fled){MOBGRACE=T+2.5;if(lost){MOBS=[];return}
  if(fled){mb.chase=0;mb.calm=T+6;mb.engaged=0;return}
  MOBS=MOBS.filter(q=>q!==mb);const c=CELLS.get(mb.cell);if(c){c.live=Math.max(0,c.live-1);c.until=T+150}}
function drawMob(mb){const k=mb.moving?mb.t:1,X=(mb.fx+(mb.x-mb.fx)*k)*TS,Y=(mb.fy+(mb.y-mb.fy)*k)*TS,walk=mb.moving?(mb.t<.5?1:-1)*(mb.step%2?1:-1):0;

  else for(let i=n-1;i>=0;i--){const q=mb.mons[i],sc=(MSCALE[q.id]||.27)*(i?.85:1),fly=FLYERS.has(q.id),bob=fly?Math.sin(T*4+mb.id)*3-8:0;const ox=i?(mb.dir==='left'?12:-12):0;
    cx.fillStyle='rgba(0,0,0,.25)';ell(X+16+ox,Y+29,10*(sc/.27),3);cx.save();cx.translate(X+16+ox,Y+30+bob+(mb.moving?-Math.abs(Math.sin(mb.t*Math.PI))*2:0));cx.scale(mb.dir==='right'?-sc:sc,sc);

function circ(x,y,r){cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
function ell(x,y,a,b,r=0){cx.beginPath();cx.ellipse(x,y,a,b,r,0,7);cx.fill()}
function tri(a,b,c,d,e,f){cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.lineTo(e,f);cx.closePath();cx.fill()}
function seg(pts,w,col){cx.strokeStyle=col;cx.lineWidth=w;cx.beginPath();cx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)cx.lineTo(pts[i],pts[i+1]);cx.stroke()}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.quadraticCurveTo(x+w,y,x+w,y+r);cx.lineTo(x+w,y+h-r);cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);cx.lineTo(x+r,y+h);cx.quadraticCurveTo(x,y+h,x,y+h-r);cx.lineTo(x,y+r);cx.quadraticCurveTo(x,y,x+r,y);cx.fill()}
function flame(x,y,s=1){const f=Math.sin(T*18+x)*1.2+Math.sin(T*11+y);cx.fillStyle='#ff8a2a';ell(x,y-5*s,4*s,8*s+f*.6);cx.fillStyle='#ffe27a';ell(x,y-3*s,2*s,4.5*s+f*.3)}

  for(let i=0;i<3;i++){const a=hash(x,y,i)*26+2,b=hash(x,y,i+7)*24+4;cx.fillStyle=i?'#4a7a2f':'#69a046';cx.fillRect(X+a,Y+b,2,4);cx.fillRect(X+a+2,Y+b-2,2,4)}}

  if(B.fire>0){const p=1-B.fire/.5;for(let i=0;i<18;i++){const a=i/18*Math.PI*2+hash(i,9),r=p*90*(.6+hash(i,3)*.6);cx.fillStyle=i%3?`rgba(255,${120+i*6},40,${1-p})`:`rgba(255,230,120,${1-p})`;circ(TX+Math.cos(a)*r,260+Math.sin(a)*r*.8,10*(1-p)+3)}}
  for(const f of B.fx){f.t+=dt;cx.font=`700 ${f.big?30:24}px "Alegreya SC", Georgia, serif`;cx.textAlign='center';cx.globalAlpha=clamp(1.4-f.t*1.4,0,1);
    cx.lineWidth=5;cx.strokeStyle='#120c08';const y=f.y-f.t*46;cx.strokeText(f.s,f.x,y);cx.fillStyle=f.col;cx.fillText(f.s,f.x,y)}
  cx.globalAlpha=1;cx.textAlign='left';B.fx=B.fx.filter(f=>f.t<1);
  cx.restore();
  if(multi){const al=B.foes.filter(f=>f.hp>0).length;cx.fillStyle='rgba(42,29,20,.92)';cx.fillRect(176,12,288,40);cx.strokeStyle='#8a6a3e';cx.lineWidth=2;cx.strokeRect(177,13,286,38);
    cx.font='700 17px "Alegreya SC", Georgia, serif';cx.textAlign='center';cx.fillStyle='#efe3c4';cx.fillText(`${al} of ${B.foes.length} ${B.foes[0].guard?'guards':'foes'} standing`,320,38);
    for(const f of B.foes){if(f.hp<=0)continue;const x=f.sx;cx.fillStyle='#120c08';cx.fillRect(x-42,98,84,8);cx.fillStyle='#b8402f';cx.fillRect(x-42,98,84*f.hp/f.maxhp,8);
      cx.font='700 12px "Alegreya SC", Georgia, serif';cx.lineWidth=3;cx.strokeStyle='#120c08';cx.strokeText(f.n,x,92);cx.fillStyle=f===B.m?'#ffd34a':'#efe3c4';cx.fillText(f.n,x,92);if(f===B.m){cx.fillStyle='#ffd34a';tri(x-7,110,x+7,110,x,120)}}cx.textAlign='left'}
  if(!B.dying&&!multi){cx.fillStyle='rgba(42,29,20,.92)';cx.fillRect(176,12,288,54);cx.strokeStyle='#8a6a3e';cx.lineWidth=2;cx.strokeRect(177,13,286,52);
    cx.font='700 17px "Alegreya SC", Georgia, serif';cx.fillStyle='#efe3c4';cx.fillText(`Lv ${m.lv} ${m.n}`,190,35);
    if(m.boss){cx.font='700 13px "Alegreya SC", Georgia, serif';cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='#120c08';const tg=m.undead?'BOSS · UNDEAD':'BOSS';cx.strokeText(tg,320,84);cx.fillStyle='#ff8a70';cx.fillText(tg,320,84);cx.textAlign='left'}
    else if(m.undead){cx.fillStyle='#c9b8ff';cx.font='700 12px "Alegreya SC", Georgia, serif';cx.textAlign='right';cx.fillText('UNDEAD',450,34);cx.textAlign='left'}
    cx.fillStyle='#120c08';cx.fillRect(190,45,260,10);cx.fillStyle='#b8402f';cx.fillRect(190,45,260*m.hp/m.maxhp,10)}
  if(B.pflash>0){cx.fillStyle=`rgba(200,30,30,${B.pflash*.6})`;cx.fillRect(0,0,W,H)}
  if(B.intro>0){cx.fillStyle=`rgba(255,255,255,${B.intro})`;cx.fillRect(0,0,W,H)}
  B.shake=Math.max(0,B.shake-dt);B.flash=Math.max(0,B.flash-dt);B.pflash=Math.max(0,B.pflash-dt);B.lunge=Math.max(0,B.lunge-dt);
  B.slash=Math.max(0,B.slash-dt);B.fire=Math.max(0,B.fire-dt);B.holy=Math.max(0,B.holy-dt);B.frost=Math.max(0,(B.frost||0)-dt);B.bolt=Math.max(0,(B.bolt||0)-dt);B.intro=Math.max(0,B.intro-dt*2.2);if(B.dying)B.alpha-=dt*1.6;
}

/* =================== LOOP & INPUT =================== */
let last=performance.now();
function frame(now){cx=MAIN;cx.setTransform(RS,0,0,RS,0,0);cx.imageSmoothingEnabled=true;
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(scene==='explore'){
    tickClock(dt);updateNPCs(dt);updateMobs(dt);if(!modalOpen())updateAgents(dt);
    if(P.swing>0)P.swing-=dt;if(P.cd>0)P.cd-=dt;
    if(P.moving){P.t+=dt/.17;if(P.t>=1){const extra=P.t-1;P.t=1;P.moving=false;arrive();
      if(!P.moving&&canMove()&&held.length){tryMove(held[held.length-1]);if(P.moving)P.t=Math.min(extra,.9)}}}
    if(!P.moving&&canMove()&&held.length)tryMove(held[held.length-1]);
    renderExplore(dt);
  }else if(B)renderBattle(dt);
  requestAnimationFrame(frame);
}
const KEYDIR={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(modalOpen()){if(e.code==='Escape')closeModal();return}
  if(scene==='battle'){const n=parseInt(e.key,10);if(n>=1&&n<=9){const b=$('#actions').children[n-1];if(b&&!b.disabled)b.click();e.preventDefault()}
    if(e.code==='Escape'&&B&&B.menu!=='main'&&!B.busy){B.menu='main';renderActions()}return}
  if(MMODE===2){if(e.code==='Equal'||e.code==='NumpadAdd'){mapZoom(1);return}if(e.code==='Minus'||e.code==='NumpadSubtract'){mapZoom(-1);return}if(e.code==='Escape'){MMODE=0;return}}
  const d=KEYDIR[e.code];if(d){e.preventDefault();if(!held.includes(d))held.push(d);return}
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();interact()}
  if(e.code==='KeyX'){e.preventDefault();attack()}
  if(e.code==='KeyC')openStats();if(e.code==='KeyB')openBag();if(e.code==='KeyQ')openQuests();if(e.code==='KeyM')openMap();
});
addEventListener('keyup',e=>{const d=KEYDIR[e.code];if(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1)}});
addEventListener('blur',()=>held.length=0);
document.querySelectorAll('.dpad button').forEach(b=>{const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(!held.includes(d))held.push(d)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1)}))});
$('#aBtn').addEventListener('click',interact);$('#xBtn').addEventListener('click',attack);
$('#bStats').addEventListener('click',openStats);$('#bBag').addEventListener('click',openBag);$('#bQuests').addEventListener('click',openQuests);$('#bMap').addEventListener('click',openMap);

/* ---- NPC schedules ---- */
const HT=(x,y)=>[OX+x,OY+y],AC=(x,y)=>[CX+x,CY+y];
const SCHED=[
  {find:n=>n.kind==='maud',home:HT(16,11),box:'town',def:[[7,...HT(19,14),2],[12,...HT(9,12),1],[13.5,...HT(19,14),2],[18,'home']],sun:[[8,...HT(8,28),1],[12,...HT(19,14),2],[17,'home']]},
  {add:{kind:'farmer',name:'Farmer Tobin',lines:['"Turnips don\'t pull themselves!"','"I sell my crop to Bram at the Stag. Best stew in the realm, thanks to me."','"Sundays I rest. Well, I sit by the chapel and complain about turnips."']},home:HT(28,27),box:'town',
    def:[[6,...HT(24,36),2],[12,...HT(9,12),1],[13,...HT(24,36),2],[18,...HT(21,15),3],[21,'home']],sun:[[9,...HT(8,28),1],[11,...HT(21,15),3],[20,'home']]},
  {add:{kind:'child',name:'Lina',lines:['"Tag! You\'re it! ...Hey, come back!"','"Mama says the pond has a frog king in it."','"I\'m not allowed past the gate. Is it scary out there?"']},home:HT(16,27),box:'town',
    def:[[8,...HT(21,15),4],[12,'home'],[14,...HT(31,17),3],[19,'home']],sun:[[9,...HT(8,28),1],[11,...HT(21,15),4],[18,'home']]},
  {find:n=>n.kind==='hilde',home:AC(24,34),box:'castle',stall:AC(36,40),
    mkt:[[7,...AC(36,40),0],[17,'home']],def:[[9,...AC(26,40),3],[12,'home'],[15,...AC(30,30),3],[18,'home']],sun:[[9,...AC(48,15),1],[12,'home']]},
  {find:n=>n.name==='Street Minstrel',home:AC(38,34),box:'castle',def:[[10,...AC(26,18),2],[14,...AC(28,42),2],[17,'home']],sun:[[11,...AC(48,15),1],[14,...AC(26,18),2],[17,'home']]},
  {find:n=>n.kind==='noble',home:AC(52,22),box:'castle',def:[[10,...AC(36,17),3],[12,...AC(8,8),3],[15,...AC(34,41),3],[18,'home']],sun:[[9,...AC(48,15),1],[12,...AC(36,17),3],[16,'home']]},
  {find:n=>n.name==='Sellsword',home:AC(38,34),box:'castle',def:[[8,...AC(51,35),2],[12,...AC(36,41),3],[16,...AC(55,23),2],[20,'home']]},
  {add:{kind:'garrick',name:'Old Garrick',lines:['"Out for my afternoon walk. Doctor\'s orders. Well, my knees\' orders."','"The crypt is under the cathedral. Aim for the joints."']},home:AC(43,22),box:'castle',twin:'garrick',
    def:[[14,...AC(26,17),2],[17,'home']],sun:[[10,...AC(48,15),1],[12,'home']]},
  {add:{kind:'pip',name:'Pip',lines:['"I\'m playing knights! You can be the dragon!"','"Whiskers? Have you seen Whiskers?"']},home:AC(15,22),box:'castle',twin:'pip',
    def:[[10,...AC(24,41),3],[12,'home'],[15,...AC(30,30),3],[18,'home']]}];
const BOXES={town:[OX-2,OY-2,OX+TW+16,OY+TH+10],castle:[CX-2,CY-2,CX+CW+2,CY+CH+2]};
const WALKERS=[],TWIN={};
function nearestOpen(x,y){if(!terrainSolid('world',x,y))return [x,y];for(let r=1;r<6;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(!terrainSolid('world',x+dx,y+dy))return [x+dx,y+dy];return [x,y]}
for(const sc of SCHED){let n=sc.add?{...sc.add}:MAPS.world.npcs.find(sc.find);if(!n)continue;if(sc.add)MAPS.world.npcs.push(n);
  Object.assign(n,{sched:sc,home:nearestOpen(...sc.home),fx:0,fy:0,t:0,moving:false,path:[],step:0,wait:0,dir:'down'});if(sc.stall)n.stall=sc.stall;
  for(const k of ['def','sun','mkt'])if(sc[k])sc[k]=sc[k].map(e=>e[1]==='home'?e:[e[0],...nearestOpen(e[1],e[2]),e[3]]);
  WALKERS.push(n);if(sc.twin)TWIN[sc.twin]=n}
for(const k of ['pip','garrick']){const IM=MAPS[k];if(IM)for(const n of IM.npcs)if(n.kind===k){const tw=TWIN[k];n.when=()=>!tw||tw.hidden}}
for(const k in MAPS){const M=MAPS[k];if(M.outdoor)continue;for(const n of M.npcs){const prev=n.when;
  if(HOURS[n.kind])n.when=prev?()=>prev()&&openNow(n.kind):()=>openNow(n.kind);
  else if(n.hours){const [a,b]=n.hours;n.when=()=>{const t=S.min/60;return b>24?(t>=a||t<b-24):(t>=a&&t<b)}}}}
for(const [m,name,hrs] of [['tavern','Lute the Bard',[17,25]],['tavern','Weary Adventurer',[12,26]],['guild','Guild Recruit',[8,20]]]){const n=MAPS[m].npcs.find(q=>q.name===name);if(n){n.hours=hrs;const [a,b]=hrs;n.when=()=>{const t=S.min/60;return b>24?(t>=a||t<b-24):(t>=a&&t<b)}}}
function slotOf(n){const sc=n.sched,d=S.day%7,tbl=(d===6&&sc.sun)||(sc.mkt&&[0,2,4,5].includes(d)&&sc.mkt)||sc.def,h=S.min/60;let cur=tbl[tbl.length-1];for(const e of tbl)if(e[0]<=h)cur=e;return cur}
function bfs(n,tx,ty){const [bx0,by0,bx1,by1]=BOXES[n.sched.box],W2=bx1-bx0+1,seen=new Map(),q=[[n.x,n.y]];seen.set(n.x+','+n.y,null);
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty){const path=[];let k=x+','+y;while(k){const [a,b]=k.split(',').map(Number);path.push([a,b]);k=seen.get(k)}path.pop();return path.reverse()}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(seen.has(k)||nx<bx0||ny<by0||nx>bx1||ny>by1)continue;if(terrainSolid('world',nx,ny)&&!(nx===tx&&ny===ty))continue;seen.set(k,x+','+y);q.push([nx,ny])}}
  return null}
function snapNPCs(){for(const n of WALKERS){const e=slotOf(n);n.moving=false;n.path=[];n.goal=e.join(',');if(e[1]==='home'){n.hidden=true;[n.x,n.y]=n.home}else{n.hidden=false;n.x=e[1];n.y=e[2]}n.anchor=e[1]==='home'?null:[e[1],e[2],e[3]||0]}}
function occupied(x,y,self){if(S.map==='world'&&P.x===x&&P.y===y)return true;return WALKERS.some(o=>o!==self&&!o.hidden&&o.x===x&&o.y===y)||MAPS.world.npcs.some(o=>o!==self&&!o.sched&&o.x===x&&o.y===y)}
function updateNPCs(dt){for(const n of WALKERS){if(n.agent)continue;const e=slotOf(n),key=e.join(',');
  if(key!==n.goal){n.goal=key;if(n.hidden&&e[1]!=='home'){n.hidden=false;[n.x,n.y]=n.home;if(occupied(n.x,n.y,n)){n.goal=null;n.hidden=true;continue}}
    n.anchor=e[1]==='home'?null:[e[1],e[2],e[3]||0];const t=e[1]==='home'?n.home:[e[1],e[2]];n.path=n.hidden?[]:(bfs(n,t[0],t[1])||[]);n.dest=t}
  if(n.hidden)continue;
  if(n.moving){n.t+=dt/.32;if(n.t>=1){n.t=1;n.moving=false;if(!n.path.length&&n.dest&&n.x===n.dest[0]&&n.y===n.dest[1]&&e[1]==='home')n.hidden=true}continue}
  if(n.path.length){const [nx,ny]=n.path[0];if(occupied(nx,ny,n)){n.wait+=dt;if(n.wait>1.5){n.wait=0;const t=n.dest;n.path=bfs(n,t[0],t[1])||[]}continue}
    n.path.shift();n.wait=0;n.dir=nx>n.x?'right':nx<n.x?'left':ny>n.y?'down':'up';n.fx=n.x;n.fy=n.y;n.x=nx;n.y=ny;n.t=0;n.moving=true;n.step++;continue}
  if(e[1]==='home'){const t=n.home;if(n.x!==t[0]||n.y!==t[1]){n.wait+=dt;if(n.wait>1){n.wait=0;n.path=bfs(n,t[0],t[1])||[]}}else n.hidden=true;continue}
  if(n.anchor&&n.anchor[2]>0){n.wait+=dt;if(n.wait>2.5+hash(n.x,n.y,S.day)*3){n.wait=0;const [ax,ay,r]=n.anchor,tx=ax+ri(-r,r),ty=ay+ri(-r,r);if(!terrainSolid('world',tx,ty)&&!occupied(tx,ty,n)){n.dest=[tx,ty];n.path=bfs(n,tx,ty)||[]}}}
  else if(!n.moving)n.dir='down'}}
for(const k in MAPS)MAPS[k].npcs.forEach((n,i)=>{n.id=n.id||k+':'+i+':'+(n.name||n.kind);n.map=k;if(!n.sched)n.post=[n.x,n.y]});
S.alert=S.alert||{};
snapNPCs();
rebuildBroken();hud();requestAnimationFrame(frame);
if(fresh){S.wv=3;openIntro()}else if(ULTNEW)setTimeout(()=>toast('Ultimate gear added to your satchel. Press B to try it on.'),600);
