<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollowmere</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+SC:wght@500;700&family=Jacquard+24&display=swap">
<style>
/* Layout: one walnut-framed game window — HUD strip, canvas stage, then controls or battle menu; dialogs are parchment */
:root{
  --bg:#130e0a; --wood:#2a1d14; --wood2:#3a281a; --line:#5c4128; --trim:#8a6a3e;
  --ink:#efe3c4; --dim:#b29d78; --parch:#eadbb4; --parch2:#d9c595; --pink:#3a2616; --pdim:#6e5537;
  --ox:#8b2e24; --gold:#d4a23c; --hp:#b8402f; --mp:#3f6fc0; --xp:#8aa53a; --night:#a9a2e0;
  --display:'Jacquard 24','UnifrakturMaguntia',Georgia,serif; --sc:'Alegreya SC',Georgia,serif; --body:'Alegreya',Georgia,serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0}
body{font-family:var(--body);font-size:17px;line-height:1.4;padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at top,#211710,var(--bg) 70%) var(--bg)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{font-family:var(--sc);font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--ink);
  background:linear-gradient(#5d4027,#45301d);border:2px solid #1e140d;box-shadow:inset 0 1px 0 #7d5a36,0 2px 0 #1e140d;
  border-radius:3px;padding:8px 13px;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:8px;position:relative}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 #7d5a36}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:13px;padding:5px 10px}
.btn.seal{background:linear-gradient(#a3372b,#7a271e);box-shadow:inset 0 1px 0 #c25446,0 2px 0 #3d120d}
kbd{font-family:var(--sc);font-size:11px;color:var(--dim);border:1px solid #6b4c30;padding:0 4px;border-radius:2px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:linear-gradient(#33231a,#261a12);
  border:3px solid var(--line);box-shadow:inset 0 0 0 1px var(--trim),0 3px 0 #0b0806;padding:10px 12px;border-radius:4px}
.id{display:flex;align-items:center;gap:12px}
.lvl{display:grid;place-items:center;width:50px;height:50px;border-radius:47% 53% 50% 50%/52% 46% 54% 48%;
  background:radial-gradient(circle at 38% 34%,#b8453a,#7a251c 70%);box-shadow:0 0 0 3px #5e1b14,inset 0 -3px 0 #5e1b14;line-height:1;text-align:center}
.lvl .lbl{display:block;font-size:10px;color:#f3d9a8;letter-spacing:.12em}
.lvl b{font-family:var(--sc);font-size:20px;color:#fbe7b8}
.where{display:flex;flex-direction:column;gap:2px}
#hPlace{font-family:var(--display);font-size:26px;line-height:1;color:var(--gold)}
.time{font-family:var(--sc);font-size:12px;letter-spacing:.1em;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase}
.time::before{content:"";width:10px;height:10px;border-radius:50%}
.time.day{color:var(--gold)} .time.day::before{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.time.night{color:var(--night)} .time.night::before{box-shadow:inset -3px -1px 0 0 var(--night)}
.bars{flex:1 1 220px;min-width:0;display:grid;gap:5px}
.row{display:grid;grid-template-columns:24px 1fr 72px;gap:8px;align-items:center}
.lbl{font-family:var(--sc);font-size:12px;color:var(--dim);letter-spacing:.06em}
.bar{height:11px;background:#120c08;border:1px solid #6b4c30;overflow:hidden;border-radius:2px}
.bar i{display:block;height:100%;transition:width .25s;box-shadow:inset 0 2px 0 rgba(255,255,255,.18)}
.bar.hp i{background:var(--hp)} .bar.mp i{background:var(--mp)} .bar.xp i{background:var(--xp)}
.num{font-family:var(--sc);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gold{font-family:var(--sc);font-weight:700;font-size:16px;color:var(--gold);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--sc);font-weight:700;font-size:14px;color:var(--ink);background:#1a120c;border:1px solid #6b4c30;border-radius:3px;padding:1px 8px;margin-right:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #9a6f22}
.hbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.badge{position:absolute;top:-8px;right:-8px;background:var(--xp);color:#1b230a;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}

/* Stage */
.stage{position:relative;border:3px solid var(--line);box-shadow:inset 0 0 0 1px var(--trim),0 0 0 1px #0b0806;background:#000;line-height:0;border-radius:3px;overflow:hidden}
canvas{width:100%;height:auto;display:block;touch-action:none}
#fade{position:absolute;inset:0;background:#05040a;opacity:0;pointer-events:none;transition:opacity .4s}

/* Battle */
.battle{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px}
.log{background:linear-gradient(var(--parch),var(--parch2));color:var(--pink);border:3px solid var(--line);border-radius:3px;padding:10px 14px;min-height:124px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:16px}
.log p{margin:0;color:var(--pdim)} .log p:last-child{color:var(--pink);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.actions .btn{min-height:48px}

/* Touch */
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 6px}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.dpad button,.abtn{font-family:var(--sc);color:var(--ink);background:linear-gradient(#5d4027,#45301d);border:2px solid #1e140d;box-shadow:inset 0 1px 0 #7d5a36;border-radius:4px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad .u{grid-area:1/2} .dpad .l{grid-area:2/1} .dpad .r{grid-area:2/3} .dpad .d{grid-area:3/2}
.dpad button:active,.abtn:active{filter:brightness(1.25)}
.xbtn{background:radial-gradient(circle at 38% 34%,#7d8a96,#4a525c 70%)!important;color:#f3ead0!important;width:64px!important;height:64px!important;margin-bottom:24px}
.abtn{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#b8453a,#7a251c 70%);color:#fbe7b8;font-size:24px}
.keys{margin:0;font-family:var(--sc);font-size:13px;color:var(--dim);letter-spacing:.03em;display:flex;flex-wrap:wrap;gap:6px 18px}
@media (hover:hover) and (pointer:fine){ .controls{display:none} }
@media not ((hover:hover) and (pointer:fine)){ .keys{display:none} }
@media (max-width:520px){ .battle{grid-template-columns:1fr} .log{min-height:96px} #hPlace{font-size:22px} }

/* Parchment dialogs */
.modal{position:fixed;inset:0;background:rgba(8,5,3,.7);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{width:min(500px,100%);max-height:86vh;overflow:auto;color:var(--pink);
  background:radial-gradient(ellipse at center,var(--parch) 55%,var(--parch2));border:3px solid var(--line);
  box-shadow:0 0 0 5px #20160f,0 0 0 7px var(--trim),0 12px 40px rgba(0,0,0,.6);border-radius:3px;padding:20px;display:flex;flex-direction:column;gap:11px}
.mbox h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--ox)}
.mbox h3{font-family:var(--sc);font-size:14px;color:var(--pdim);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #b89c68;padding-bottom:3px;margin-top:4px}
.mbox p{margin:0;max-width:62ch}
.say{font-style:italic}
.sub{color:var(--pdim);font-size:16px}
.g{color:#7a5314}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:4px 0;border-bottom:1px dotted #b89c68}
.item b{font-family:var(--sc);font-size:16px}
.item small{display:block;color:var(--pdim);font-size:15px}
.price{font-family:var(--sc);font-weight:700;font-size:15px;color:#7a5314;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:minmax(0,1fr) 34px auto;gap:10px;align-items:center;padding:3px 0;border-bottom:1px dotted #b89c68}
.stat b{font-family:var(--sc);font-size:16px}
.stat .v{font-family:var(--sc);font-weight:700;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 16px;font-size:16px}
.derived span{color:var(--pdim)} .derived b{font-family:var(--sc);float:right}
.pts{background:#f3e7c4;border:1px dashed var(--ox);color:var(--ox);padding:7px 10px;font-family:var(--sc);font-weight:700;font-size:15px;border-radius:3px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--parch);color:var(--pink);border:3px solid var(--line);box-shadow:0 0 0 2px var(--trim);padding:9px 18px;font-family:var(--sc);font-weight:700;font-size:15px;border-radius:3px;max-width:min(90vw,480px);text-align:center}
@media (prefers-reduced-motion:reduce){ #fade,.bar i{transition:none} }
/* Satchel */
.mbox.wide{width:min(900px,100%)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.inv{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:16px;align-items:start}
.lcol{display:flex;flex-direction:column;gap:10px}
.doll{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;background:radial-gradient(ellipse at 50% 40%,#43301f,#211710 75%);
  border:3px solid var(--line);box-shadow:inset 0 0 0 1px var(--trim),0 3px 0 #0b0806;border-radius:4px;padding:12px 10px 10px;color:var(--ink)}
.dc{display:grid;gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:2px}
.cap{font-family:var(--sc);font-size:11px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.slot,.tile{position:relative;display:grid;place-items:center;cursor:pointer;color:var(--rc,#6b4c30);background:linear-gradient(#22170f,#140d08);
  border:2px solid var(--rc,#6b4c30);border-radius:4px;box-shadow:inset 0 0 10px rgba(0,0,0,.6),0 2px 0 #0b0806;padding:0}
.slot{width:58px;height:58px}
.slot svg{width:38px;height:38px}
.slot.empty{border-style:dashed;color:#6b4c30;--rc:#6b4c30}
.slot:hover,.tile:hover{filter:brightness(1.25)}
.slot:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.slot.on,.tile.on{box-shadow:0 0 0 3px var(--gold),inset 0 0 12px rgba(0,0,0,.6)}
.fig{display:grid;place-items:center}
.fig img{width:120px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.dst{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:2px 12px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px;
  font-family:var(--sc);font-size:12px;color:var(--dim)}
.dst b{float:right;color:var(--ink);font-variant-numeric:tabular-nums}
.rcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.ph b{font-family:var(--sc);font-size:16px}
.flt{display:flex;gap:4px;margin-left:auto}
.chip{font-family:var(--sc);font-size:12px;color:var(--pink);background:transparent;border:1px solid #b89c68;border-radius:12px;padding:2px 10px;cursor:pointer}
.chip.on{background:var(--pink);color:var(--parch);border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;max-height:min(440px,52vh);overflow:auto;align-content:start;background:#2a1d14;border:3px solid var(--line);border-radius:4px;padding:8px}
.tile{aspect-ratio:1}
.tile svg{width:62%;height:62%}
.tile img.ico{width:86%;height:86%}
.slot img.ico{width:50px;height:50px}
.ic img.ico{width:38px;height:38px}
.slot:not(.empty),.tile{background:radial-gradient(circle at 50% 45%,#3a2a1c,#140d08 75%)}
.tile.fit{box-shadow:0 0 0 2px #e8c76a,0 0 10px #e8c76a}
.tile i{position:absolute;font-style:normal;font-family:var(--sc);font-weight:700;font-size:10px;line-height:1}
.tile .up{top:3px;right:4px;color:#9bd36a}
.tile .two{bottom:3px;right:4px;color:var(--dim)}
.legend{font-family:var(--sc);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.card{background:#f3e7c4;border:2px solid #b89c68;border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.card.hint{border-style:dashed}
.ch{display:flex;gap:10px;align-items:center}
.ic{display:grid;place-items:center;width:42px;height:42px;flex:none;color:var(--rc);background:#1a120c;border:2px solid var(--rc);border-radius:4px}
.ic svg{width:30px;height:30px}
.cn{font-family:var(--sc);font-size:17px;line-height:1.15;display:block}
.ch .sub{font-size:14px;display:block}
.cl{margin:2px 0 0;font-size:15px;padding-left:18px}
.cs{margin:2px 0 0;font-family:var(--sc);font-size:14px}
.cl .fx{font-style:italic;color:var(--ox)}
.dls{display:grid;gap:1px;font-size:14px}
.dl{display:grid;grid-template-columns:1fr auto 40px;gap:6px;border-bottom:1px dotted #b89c68}
.dl b{font-family:var(--sc);font-variant-numeric:tabular-nums}
.dl i{font-style:normal;font-family:var(--sc);font-weight:700;text-align:right}
.dl.pos i{color:#2f7a2a} .dl.neg i{color:#9a3a2a}
@media (max-width:700px){.inv{grid-template-columns:1fr}.slot{width:52px;height:52px}.fig img{width:100px}}

</style>
</head>
<body>


<div class="wrap">
  <header class="hud">
    <div class="id">
      <div class="lvl"><div><span class="lbl">LV</span><b id="hLv">1</b></div></div>
      <div class="where"><span id="hPlace">Hollowmere</span><span id="hTime" class="time day">Day</span></div>
    </div>
    <div class="bars">
      <div class="row"><span class="lbl">HP</span><div class="bar hp"><i id="hHPb"></i></div><span id="hHP" class="num"></span></div>
      <div class="row"><span class="lbl">MP</span><div class="bar mp"><i id="hMPb"></i></div><span id="hMP" class="num"></span></div>
      <div class="row"><span class="lbl">XP</span><div class="bar xp"><i id="hXPb"></i></div><span id="hXP" class="num"></span></div>
    </div>
    <div class="side">
      <div class="gold"><span id="hClock" class="clock">Mon 8:00 AM</span><i class="coin"></i><span id="hGold">0</span> g</div>
      <div class="hbtns">
        <button class="btn sm" id="bStats">Talents<span id="ptsBadge" class="badge" hidden>0</span></button>
        <button class="btn sm" id="bBag">Satchel</button>
        <button class="btn sm" id="bQuests">Quests<span id="qBadge" class="badge" hidden>!</span></button>
        <button class="btn sm" id="bMap">Map</button>
      </div>
    </div>
  </header>

  <div class="stage">
    <canvas id="cv" width="768" height="576" aria-label="Game world"></canvas>
    <div id="fade"></div>
  </div>

  <section class="battle" id="battleUI" hidden>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="actions" id="actions"></div>
  </section>

  <section class="controls" id="controls">
    <div class="dpad">
      <button class="u" data-d="up" aria-label="Up">▲</button>
      <button class="l" data-d="left" aria-label="Left">◀</button>
      <button class="r" data-d="right" aria-label="Right">▶</button>
      <button class="d" data-d="down" aria-label="Down">▼</button>
    </div>
    <div style="display:flex;gap:12px;align-items:flex-end"><button class="abtn xbtn" id="xBtn" aria-label="Attack">X</button><button class="abtn" id="aBtn" aria-label="Talk or search">A</button></div>
  </section>
  <p class="keys"><span>Move: WASD / Arrows</span><span>Talk · Search: Space</span><span>Attack: X</span><span>Talents: C</span><span>Satchel: B</span><span>Quests: Q</span><span>Map: M</span><span>Battle: 1–9</span></p>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#cv');let cx=cv.getContext('2d');const MAIN=cx;
let RS=2;
const TC=document.createElement('canvas');const tcx=TC.getContext('2d');
const TS2=document.createElement('canvas');const tsx=TS2.getContext('2d');

  tsx.setTransform(1,0,0,1,0,0);tsx.globalCompositeOperation='source-over';tsx.clearRect(0,0,TS2.width,TS2.height);tsx.drawImage(TC,0,0);tsx.globalCompositeOperation='source-in';tsx.fillStyle='rgba(18,10,5,.72)';tsx.fillRect(0,0,TS2.width,TS2.height);
  const ox=X-32,oy=Y-64;for(const [a,b] of [[-1,0],[1,0],[0,-1],[0,1]])cx.drawImage(TS2,ox+a,oy+b,96,112);cx.drawImage(TC,ox,oy,96,112)}
const OUTL_IN=new Set('CBQnbxsTcMWSPAYFGVLOHzuE'),OUTL_OUT=new Set('bxkhFPLOAlNj');
const TS=32, W=768, H=576;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(x,y,k=0){let h=(x*374761393+y*668265263+k*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;}

/* =================== WORLD =================== */
const BUILDINGS=[
  {x:4,y:4,w:8,h:7,roof:'thatch',door:7,kind:'inn',sign:'INN',shutter:'#3f6b35',chimney:1,to:{map:'inn',x:6,y:12}},
  {x:14,y:6,w:5,h:5,roof:'thatch',door:16,kind:'house',shutter:'#2f5f8a',chimney:1,msg:'Locked. Someone inside is snoring loudly.'},
  {x:26,y:4,w:8,h:7,roof:'tile',door:29,kind:'shop',sign:'SHOP',shutter:'#8b2e24',chimney:1,to:{map:'shop',x:7,y:12}},
  {x:36,y:6,w:5,h:5,roof:'tile',door:38,kind:'house',shutter:'#3f6b35',msg:'Locked. A cat stares at you from the window.'},
  {x:5,y:20,w:7,h:7,roof:'slate',door:8,kind:'chapel',to:{map:'chapel',x:7,y:12}},
  {x:14,y:22,w:5,h:5,roof:'thatch',door:16,kind:'house',shutter:'#8b2e24',chimney:1,msg:'Locked. You hear a baby crying.'},
  {x:26,y:22,w:5,h:5,roof:'thatch',door:28,kind:'house',shutter:'#2f5f8a',msg:'Locked. A note reads: "Gone to the fields. Back by dusk."'},
  {x:34,y:21,w:6,h:6,roof:'slate',door:36,kind:'house',shutter:'#4a3220',chimney:1,msg:'The smithy is shut. "Closed for the harvest festival."'}];

function makeTown(){
  const w=44,h=32,G=[],O=[];
  for(let y=0;y<h;y++){G.push(Array(w).fill('.'));O.push(Array(w).fill(' '))}

function tryMove(d){

function enterDoor(x,y){

  {const k=MAPS[b.to.map].keeper||{keep:'lord',cathedral:'bishop'}[b.to.map];if(k&&HOURS[k]&&!openNow(k)){say('Closed',`The door is locked. ${MAPS[b.to.map].name}: ${hoursText(k)}`,`It's ${fmtH(S.min/60)} on ${DAYN[S.day%7]}.`);return}}

}

    else if(o==='e')say('Sheep',['Baaa.','The sheep chews thoughtfully and ignores you.','Baaaaa!'][Math.floor(hash(x,y,T|0)*3)]);
    else if(o==='Y')say('Dead Willow','Grey moss hangs from its branches like old hair.');

    else if(o==='c')say('Glimmer Crystal','It hums with a cold light, rooted deep in the rock. Rock Golems sometimes carry shards of it.');

    else if(o==='p')say('Broken Pillar','Carved with kings and queens whose faces have worn away.');
    else if(o==='J')say('Gravestone',['"Here lies Osric. He went to the Darkwood alone."','"Beloved Wenna. She fed the town through the long winter."','"A knight of Varn. Rest, and do not rise."','The name has worn away completely.','"Tobias the Miller. He finally got some rest."'][Math.floor(hash(x,y,3)*5)]);
    else if(o==='I')say('Mountain Pine','Wind-bent and stubborn.');

  if(n.moving){n.t+=dt/.32;if(n.t>=1){n.t=1;n.moving=false;if(!n.path.length&&n.dest&&n.x===n.dest[0]&&n.y===n.dest[1]&&e[1]==='home')n.hidden=true}continue}
  if(n.path.length){const [nx,ny]=n.path[0];if(occupied(nx,ny,n)){n.wait+=dt;if(n.wait>1.5){n.wait=0;const t=n.dest;n.path=bfs(n,t[0],t[1])||[]}continue}
    n.path.shift();n.wait=0;n.dir=nx>n.x?'right':nx<n.x?'left':ny>n.y?'down':'up';n.fx=n.x;n.fy=n.y;n.x=nx;n.y=ny;n.t=0;n.moving=true;n.step++;continue}
  if(e[1]==='home'){const t=n.home;if(n.x!==t[0]||n.y!==t[1]){n.wait+=dt;if(n.wait>1){n.wait=0;n.path=bfs(n,t[0],t[1])||[]}}else n.hidden=true;continue}
  if(n.anchor&&n.anchor[2]>0){n.wait+=dt;if(n.wait>2.5+hash(n.x,n.y,S.day)*3){n.wait=0;const [ax,ay,r]=n.anchor,tx=ax+ri(-r,r),ty=ay+ri(-r,r);if(!terrainSolid('world',tx,ty)&&!occupied(tx,ty,n)){n.dest=[tx,ty];n.path=bfs(n,tx,ty)||[]}}}
  else if(!n.moving)n.dir='down'}}
for(const k in MAPS)MAPS[k].npcs.forEach((n,i)=>{n.id=n.id||k+':'+i+':'+(n.name||n.kind);n.map=k;if(!n.sched)n.post=[n.x,n.y]});
S.alert=S.alert||{};
snapNPCs();
rebuildBroken();hud();requestAnimationFrame(frame);
if(fresh){S.wv=3;openIntro()}else if(ULTNEW)setTimeout(()=>toast('Ultimate gear added to your satchel. Press B to try it on.'),600);
